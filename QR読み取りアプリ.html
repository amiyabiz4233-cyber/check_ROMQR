<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>点検スキャナー V19.8</title>

    <!-- ★ V15.7修正: CDNが遅い/ブロックされてもトップpage描画を止めないよう async 化 -->
    <script async src="https://unpkg.com/html5-qrcode"></script>
    <script async src="https://cdnjs.cloudflare.com/ajax/libs/encoding-japanese/2.1.0/encoding.min.js"></script>

    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
            background: var(--bg-color);
            color: var(--text-color);
        }

        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 12px;
            position: relative;
        }

        .version-tag {
            position: absolute;
            top: 8px;
            right: 12px;
            font-size: 10px;
            color: #999;
        }

        #reader-wrapper {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            border: 3px solid #3b82f6;
            position: relative;
        }

        #reader {
            width: 100%;
            min-height: 280px;
        }

        /* ★ V18.5: 封印登録ボタン（カメラ映像に重ねる緑ボタン）
              上下2か所に同じものを出す。どちらを押しても動きは同じ。
              封印を1枚スキャンするまでは非表示。 */
        .seal-register-btn {
            display: none;                 /* ★ 初期は非表示。JSが表示を切り替える */
            position: absolute;
            left: 80px;                    /* 端10px + ライト60px + すき間10px */
            right: 80px;
            /* ★重要: 全体の button { width: 100% } に負けて right が無視され、
                  右へはみ出す（V18.4で発生）。width:auto で left/right 指定を効かせる */
            width: auto;
            height: 60px;                  /* ライトボタンと同じ高さ */
            padding: 0;
            margin: 0;
            border: 2px solid #15803d;
            border-radius: 12px;
            background-color: #22c55e;     /* 緑 */
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            line-height: 1;
            z-index: 100;                  /* ライトボタンと同じ重なり順 */
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            -webkit-tap-highlight-color: transparent;
        }
        .seal-register-btn:active { background-color: #16a34a; }

        /* 上＝カメラ枠の上端 / 下＝左右のライトと同じ高さ（ライトとライトの間） */
        #btn-seal-register-top    { top: 10px; }
        #btn-seal-register-bottom { bottom: 10px; }

        .torch-btn {
            display: none;
            position: absolute;
            bottom: 10px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 28px;
            border: 2px solid #fff;
            padding: 0;
            margin: 0;
            z-index: 100;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            transition: background 0.2s, color 0.2s;
        }

        /* ★ 右下・左下の配置 */
        #btn-torch { right: 10px; }
        #btn-torch-left { left: 10px; }

        .torch-btn.torch-on {
            background: #fbbf24;
            color: #000;
        }

        .status-badge {
            padding: 6px 15px;
            border-radius: 20px;
            background: #007bff;
            color: white;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            height: 50px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 18px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        .btn-primary { background: #3b82f6; color: white; }
        .btn-success { background: #22c55e; color: white; }
        .btn-secondary { background: #4b5563; color: white; }
        .btn-csv { background: #10b981; color: white; margin: 25px 0; }
        .btn-danger { background: #dc2626; color: white; }

        /* ★ ROMキーボード切替ボタン（目立たせる＋モードで色変化） */
        #rom-kb-toggle {
            height: 64px;
            font-size: 22px;
            font-weight: bold;
            border: 3px solid transparent;
            border-radius: 12px;
            color: #fff;
            box-shadow: 0 3px 8px rgba(0,0,0,0.25);
        }
        #rom-kb-toggle.kb-numeric {
            background: #0d9488;       /* ティール（数字モード） */
            border-color: #0f766e;
        }
        #rom-kb-toggle.kb-voice {
            background: #f97316;       /* オレンジ（音声モード） */
            border-color: #ea580c;
        }

        .rom-toggle-btn {
            flex: 1;
            height: 50px;
            margin-top: 5px;
            padding: 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: #fff;
            color: #333;
            font-size: 18px;
            font-weight: bold;
            box-sizing: border-box;
        }

        /* ★ V16.6: ROM①/③ 用スピンボタン */
        .rom-spin-row {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }
        .rom-spin-btn {
            flex: 1;
            height: 38px;
            padding: 0;
            margin: 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: #f7f7f7;
            color: #333;
            font-size: 18px;
            font-weight: bold;
            line-height: 1;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .rom-spin-btn:active {
            background: #e0e0e0;
        }

        /* ★ V16.6: ROM①/③ 選択切替（← →）ボタン */
        .rom-nav-row {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .rom-nav-btn {
            flex: 1;
            height: 48px;
            padding: 0;
            margin: 0;
            border: 2px solid #ccc;
            border-radius: 8px;
            background: #fff;
            color: #333;
            font-size: 24px;
            font-weight: bold;
            line-height: 1;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .rom-nav-btn:active {
            background: #e6e6e6;
        }

        .shop-name-display {
            color: #007bff;
            font-weight: bold;
            margin-top: 10px;
            background: #e7f1ff;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .shop-list-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            margin-top: 10px;
        }

        .shop-item {
            background: #fff;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #eee;
            font-size: 12px;
            color: #555;
        }

        #confirm-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        #confirm-modal {
            background: #fff;
            width: 90%;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-sizing: border-box;
            transform: translateY(-12vh); /* ★ センターから少し上に移動 */
        }

        /* ★ OKボタンを約3倍の大きさに */
        #confirm-modal .btn-success {
            min-height: 150px;
            font-size: 40px;
            padding: 20px;
            margin-top: 0;
        }

        /* ★ ROM確定ボタンを約3倍の大きさに */
        #btn-rom-confirm {
            min-height: 150px;
            font-size: 36px;
            padding: 20px;
        }

        /* ★ V17.9: ROM確定(左) + 十字キー(右) の横並び */
        .rom-action-row {
            display: flex;
            gap: 8px;
            align-items: stretch;
            margin-top: 10px;
        }
        /* 左：ROM確定（幅は残り全部・高さは十字キーと揃える） */
        .rom-action-row #btn-rom-confirm {
            flex: 1 1 auto;
            width: auto;
            margin: 0;
        }
        /* 右：2×2キー（左列=←→ / 右列=↑↓）。幅を細くした分だけROM確定が広がる */
        .rom-dpad {
            flex: 0 0 108px;
            width: 108px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 4px;
        }
        .rom-dpad-btn {
            padding: 0;
            margin: 0;
            border: 2px solid #ccc;
            border-radius: 8px;
            background: #fff;
            color: #333;
            font-size: 26px;
            font-weight: bold;
            line-height: 1;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .rom-dpad-btn:active { background: #e6e6e6; }
        /* 各キーの位置（左列=欄の切替(1つ) / 右上=↑ / 右下=↓）
           ★ V18.7: 左列の ← と → を1つのボタンに統合。
              grid-row: 1 / span 2 で上下2マスをまたぐので、
              大きさは旧←＋旧→（すき間4pxを含む）とぴったり同じになる。
              表示は「次に移動する先」を示す:
                ROM①にカーソル → 「→」（押すとROM③へ）
                ROM③にカーソル → 「←」（押すとROM①へ） */
        .rom-dpad-swap  { grid-column: 1; grid-row: 1 / span 2; font-size: 32px; }
        .rom-dpad-up    { grid-column: 2; grid-row: 1; }
        .rom-dpad-down  { grid-column: 2; grid-row: 2; }
        /* 選択中のROM欄を青枠で強調 */
        .rom-active-field {
            border-color: #2563eb !important;
            box-shadow: 0 0 0 2px rgba(37,99,235,0.25);
        }

        /* ★ 「登録して次の台へ」ボタンを約3倍の大きさに */
        #btn-finish {
            min-height: 150px;
            font-size: 36px;
            padding: 20px;
        }

        /* ★ 戻る確認（赤警告）オーバーレイ */
        /* ★ V18.6: 封印登録の確認モーダル（誤タップ防止）
              カメラに重ねた緑ボタンは指が当たりやすいので、
              押しても即座には登録せず、必ずこの確認を挟む。 */
        #seal-confirm-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 10004;              /* 他のモーダルより上 */
            justify-content: center;
            align-items: center;
        }

        #seal-confirm-modal {
            background: #fff;
            width: 90%;
            max-width: 420px;
            padding: 25px 20px;
            border-radius: 20px;
            text-align: center;
            box-sizing: border-box;
            transform: translateY(-12vh); /* 既存モーダルと同じく少し上へ */
        }

        #seal-confirm-modal .seal-confirm-title {
            font-size: 22px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 14px;
        }

        /* 何を登録しようとしているのかを必ず出す（台番・封印枚数の取り違え防止） */
        #seal-confirm-detail {
            text-align: left;
            font-size: 15px;
            line-height: 1.8;
            background: #f5f5f5;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 20px;
        }
        #seal-confirm-detail b { font-size: 17px; }

        /* 既存の確認モーダルと同じ並び：上=戻る（小・グレー）/ 下=OK（大・緑） */
        #seal-confirm-modal .btn-success {
            min-height: 150px;
            font-size: 40px;
            padding: 20px;
            margin-top: 10px;
        }

        #back-confirm-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(120,0,0,0.85);
            z-index: 10001;
            justify-content: center;
            align-items: center;
        }

        #back-confirm-modal {
            background: #fff;
            width: 88%;
            max-width: 420px;
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            box-sizing: border-box;
            border: 6px solid #dc2626;
            transform: translateY(-12vh); /* ★ センターから少し上 */
        }

        #back-confirm-modal .back-warning-title {
            color: #dc2626;
            font-size: 26px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* ★ V14.8: 復元/初期化 選択モーダル（confirmのOK/キャンセル廃止） */
        /* ★ V16.4: 保存データ（過去7日）一覧オーバーレイ */
        #session-list-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 10003;
            justify-content: center;
            align-items: center;
        }
        #session-list-modal {
            background: #fff;
            width: 92%;
            max-width: 460px;
            max-height: 86vh;
            overflow-y: auto;
            padding: 20px 16px;
            border-radius: 18px;
            box-sizing: border-box;
        }
        #session-list-modal h3 { margin: 0 0 6px; text-align: center; font-size: 18px; }
        #session-list-note { text-align:center; font-size:12px; color:#666; margin-bottom:14px; }
        .session-row { border: 1px solid #ddd; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        .session-row .meta { font-size: 14px; line-height: 1.6; margin-bottom: 10px; }
        .session-row .meta b { font-size: 15px; }
        .session-actions { display: flex; gap: 8px; }
        .session-actions .btn-success { flex: 1; min-height: 54px; font-size: 18px; margin: 0; }
        .session-actions .btn-del {
            width: 58px; min-height: 54px; font-size: 20px;
            background: #f0f0f0; color: #b91c1c; border: 1px solid #ddd; border-radius: 10px;
        }
        #session-new-btn { width: 100%; min-height: 56px; font-size: 18px; margin-top: 4px; }
        #session-list-empty { text-align:center; color:#666; padding:24px 0; font-size:15px; }
        #session-list-modal .btn-danger { width:100%; min-height:48px; font-size:16px; margin-top:10px; }
        #session-list-modal .btn-secondary { width:100%; min-height:48px; font-size:16px; margin-top:10px; }

        #resume-confirm-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 10002;
            justify-content: center;
            align-items: center;
        }

        #resume-confirm-modal {
            background: #fff;
            width: 90%;
            max-width: 420px;
            padding: 25px 20px;
            border-radius: 20px;
            text-align: center;
            box-sizing: border-box;
            transform: translateY(-8vh);
        }

        #resume-confirm-msg {
            white-space: pre-line;
            text-align: left;
            font-size: 15px;
            font-weight: bold;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        /* 続きから＝大きい緑（安全側を押しやすく） / 初期化＝赤 */
        #resume-confirm-modal .btn-success {
            min-height: 100px;
            font-size: 26px;
        }
        #resume-confirm-modal .btn-danger {
            min-height: 60px;
            font-size: 18px;
            margin-top: 14px;
        }
        #resume-confirm-modal .btn-slack {
            min-height: 100px;
            font-size: 26px;
            font-weight: bold;
            color: #fff;
            background: #4A154B;
            border: none;
            border-radius: 12px;
            width: 100%;
            margin-bottom: 18px;
        }
        #resume-confirm-modal .btn-slack:active {
            background: #611f69;
        }
        #resume-confirm-modal .btn-mail {
            min-height: 100px;
            font-size: 26px;
            font-weight: bold;
            color: #fff;
            background: #1565C0;
            border: none;
            border-radius: 12px;
            width: 100%;
            margin-bottom: 18px;
        }
        #resume-confirm-modal .btn-mail:active {
            background: #1976D2;
        }

        #warning-msg {
            display: none;
            color: #fff;
            background: #dc2626;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 16px;
            line-height: 1.4;
        }

        /* ★ V18.8: 封印照合パネル（前回の封印と今回の読み取りを突き合わせて出す） */
        #seal-history-note {
            display: none;
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            border: 2px solid #999;
            background: #f7f7f7;
            font-size: 14px;
            line-height: 1.6;
        }
        #seal-history-note .sh-title { font-weight: bold; font-size: 15px; margin-bottom: 6px; }
        #seal-history-note .sh-row   { font-family: monospace; font-size: 13px; letter-spacing: 0.5px; }
        #seal-history-note .sh-ok    { color: #15803d; font-weight: bold; }   /* 読めた */
        #seal-history-note .sh-wait  { color: #b45309; font-weight: bold; }   /* まだ読めていない */
        #seal-history-note .sh-new   { color: #1d4ed8; font-weight: bold; }   /* 前回に無い＝新規 */
        /* 状態ごとの枠色。背景は background-color で指定する（shorthandは使わない） */
        #seal-history-note.sh-state-wait    { border-color: #f59e0b; background-color: #fffbeb; }
        #seal-history-note.sh-state-match   { border-color: #16a34a; background-color: #f0fdf4; }
        #seal-history-note.sh-state-added   { border-color: #2563eb; background-color: #eff6ff; }
        #seal-history-note.sh-state-missing { border-color: #dc2626; background-color: #fff1f1; }

        .seal-tag {
            display: inline-block;
            background: #e2e8f0;
            padding: 4px 10px;
            border-radius: 4px;
            margin: 4px;
            font-size: 14px;
            font-weight: bold;
        }

        /* ★ V14.9: 履歴行の長押し修正 */
        #history-table tbody tr {
            -webkit-touch-callout: none;  /* iOS長押しメニュー抑止 */
            -webkit-user-select: none;
            user-select: none;
        }
        #history-table tbody tr.row-pressing {
            background: #dbeafe;  /* 長押し中のハイライト */
        }

        #edit-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 10003;
            justify-content: center;
            align-items: center;
        }

        #edit-modal {
            background: #fff;
            width: 90%;
            max-width: 420px;
            padding: 20px;
            border-radius: 20px;
            box-sizing: border-box;
            text-align: left;
            max-height: 82vh;
            overflow-y: auto;
            transform: translateY(-5vh);
        }

        #edit-modal label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #555;
            margin-top: 12px;
        }

        /* ★ V19.8: 修正画面のスキャンまわり
             注意）このアプリは button/input に width:100% が効いているため、
             横並びは flex:1 1 0（=basisを0にしてwidth:100%を無効化）＋min-width:0 で組む。 */
        .edit-field-row {
            display: flex;
            gap: 6px;
            align-items: stretch;
        }
        .edit-field-row input {
            flex: 1 1 0;
            min-width: 0;
        }
        .edit-pen-btn {
            flex: 0 0 52px;      /* ✏ボタンは固定幅。width:100%に負けないようbasisで指定 */
            width: 52px !important;
            margin-top: 5px !important;
            padding: 0;
            font-size: 20px;
        }
        #edit-scan-area {
            margin-top: 10px;
            border: 2px solid #22c55e;
            border-radius: 12px;
            padding: 8px;
            background: #f0fdf4;
        }
        #edit-scan-target-label {
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            color: #166534;
            margin-bottom: 6px;
        }
        /* カメラ映像。💡ボタンを重ねるので position:relative の枠を用意する */
        #edit-reader-wrapper {
            position: relative;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }
        #edit-reader { width: 100%; }
        #edit-reader video { width: 100% !important; display: block; }
        #btn-edit-torch {
            /* .torch-btn の位置指定を修正画面用に上書き（右上固定・幅は自動） */
            position: absolute;
            top: 8px;
            bottom: auto;   /* .torch-btn の bottom:10px を打ち消す */
            right: 8px;
            left: auto;
            width: 46px !important;
            height: 46px;
            margin: 0 !important;
            display: none;
            z-index: 5;
        }

                <div id="rom-fuzzy-note" style="display:none; color:#ffffff; font-weight:bold; margin-bottom:5px; font-size:13px; line-height:1.35; border:1px solid #4c1d95; background:linear-gradient(135deg,#7c3aed 0%,#a855f7 60%,#c026d3 100%); border-radius:5px; padding:5px 7px; text-shadow:0 1px 1px rgba(0,0,0,.3);"></div>

        <button class="btn-csv" onclick="downloadCSV()">現在のデータをCSV保存</button>

    <script>
        const shopList = {
            "01": "成田", "09": "潮来", "16": "木更津", "18": "神栖", "20": "多古", "22": "葉山",
            "23": "鹿嶋2", "28": "八日市場", "34": "奥野谷", "43": "大和", "44": "淵野辺",
            "13": "小見川", "25": "鹿嶋1", "26": "旭", "27": "八街", "29": "東金", "30": "富里",
            "31": "文違", "32": "今宮", "33": "市原", "35": "松戸", "36": "石岡", "37": "稲毛",
            "38": "佐原", "39": "川越", "40": "町田", "41": "セン南", "45": "ウイング"
        };

        const MAIL_TO = "rom_receive@bishop777.com";

        // ★ V15.6: CSV保存後に開くSlack DMグループ
        const SLACK_TEAM_ID = "T02F4QUA74M";
        const SLACK_CHANNEL_ID = "C0BKHM4P7EC"; // ★ V16.1: 送信先DMグループ変更
        // ★ V15.9修正: 「Slackは開くが指定DMが選択されない」原因は、CSV保存直後に
        //   ユーザー操作なし(location.href)で自動遷移していたため。iOSはユーザー
        //   ジェスチャ無しの外部遷移でディープリンクのルーティングを落とし、
        //   直前の会話が開いてしまう。
        //   → 自動遷移をやめ「Slackを開く」ボタンのタップ(ジェスチャ)で発火する方式に変更。
        //   タップ経由なら slack:// スキームでも指定Group DMへ確実に遷移する。
        const SLACK_DM_URL_SCHEME = `slack://channel?team=${SLACK_TEAM_ID}&id=${SLACK_CHANNEL_ID}`;
        const SLACK_DM_URL_WEB = `https://slack.com/app_redirect?team=${SLACK_TEAM_ID}&channel=${SLACK_CHANNEL_ID}`;
        // Slackアプリへ切替できたか(=visibilityがhiddenになったか)を記録
        let slackSwitched = false;
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') slackSwitched = true;
        });
        // ★ V15.9: 送信先Group DMを開く（必ずボタンのタップから呼ぶこと）
        function openSlackDM() {
            slackSwitched = false;
            window.location.href = SLACK_DM_URL_SCHEME;
            // アプリ未起動(=画面が見えたまま)の時だけ web(app_redirect) にフォールバック。
            //   Slackへ切替できていれば slackSwitched=true となりフォールバックしない
            //   （戻ってきた時に再度Slackが開く二重起動を防ぐ）。
            setTimeout(() => {
                if (!slackSwitched && document.visibilityState === 'visible') {
                    window.location.href = SLACK_DM_URL_WEB;
                }
            }, 1500);
        }

        // ★ V16.0: メール送信（V15.4の従来動作を復活。Slackと選べるようボタン化）
        //   直近保存したCSVのファイル名を本文に載せる（添付は手動）。
        //   iOSでは mailto もユーザージェスチャ経由の方が確実なのでボタンタップで発火。
        let lastSavedFileName = "";
        function openMailSend() {
            const subject = encodeURIComponent(`点検データ_${shopId}`);
            const body = encodeURIComponent(
                `点検データを送付します。\n\n` +
                `保存ファイル名: ${lastSavedFileName}\n` +
                `※保存されたCSVファイルを添付して送信してください。`
            );
            window.location.href = `mailto:${MAIL_TO}?subject=${subject}&body=${body}`;
        }

        // ★ 自動保存キー（※V14.0でも変更しない：既存の保存データを復元できなくなるため）
        const STORAGE_KEY = "inspector_v12_state";

        // ★ V16.4: 保存データを「点検開始ごとに1件」複数保持（過去7日）。1件しか残らない問題を解消
        const SESSIONS_KEY = "inspector_sessions_v1";
        const SESSION_RETENTION_MS = 7 * 24 * 60 * 60 * 1000; // 7日
        let activeSessionId = null; // 現在編集中セッションのID

        function loadSessions() {
            try { return JSON.parse(localStorage.getItem(SESSIONS_KEY)) || {}; }
            catch (e) { return {}; }
        }
        function writeSessions(obj) {
            try { localStorage.setItem(SESSIONS_KEY, JSON.stringify(obj)); }
            catch (e) { console.error("セッション保存失敗:", e); }
        }
        function newSessionId() {
            return "s" + Date.now() + Math.floor(Math.random() * 1000);
        }
        // savedAtが7日より古いセッションを削除して返す
        function pruneOldSessions() {
            const now = Date.now();
            const s = loadSessions();
            let changed = false;
            Object.keys(s).forEach(id => {
                const t = Date.parse(s[id] && s[id].savedAt) || 0;
                if (!t || (now - t) > SESSION_RETENTION_MS) { delete s[id]; changed = true; }
            });
            if (changed) writeSessions(s);
            return s;
        }
        // 旧単一キー(inspector_v12_state)の保存を1件だけ移行（後方互換・初回のみ）
        function migrateLegacyState() {
            let json = null;
            try { json = localStorage.getItem(STORAGE_KEY); } catch (e) { return; }
            if (!json) return;
            try {
                const saved = JSON.parse(json);
                if (hasMeaningfulSavedData(saved)) {
                    const s = loadSessions();
                    const id = "legacy";
                    if (!s[id]) {
                        if (!saved.savedAt) saved.savedAt = new Date().toISOString();
                        s[id] = saved;
                        writeSessions(s);
                    }
                }
            } catch (e) {}
            try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        }

        let staffId, shopId;
        let currentStep = 1;
        let lastRenderedStep = 0; // ★ V16.6: ステップ変化検知（画面遷移時のスクロールトップ用）
        let currentData = { seals: [] };
        let allData = [];
        let html5QrCode;
        let pendingValue = "";
        let prevRom1 = "";
        let prevRom3 = "";
        let toastTimer = null;
        let audioContext = null;
        let torchOn = false;       // 実際のLED状態
        // ★ V16.7: ライトは初期値ON（カメラ起動・復帰時に自動点灯。ユーザーが消せばOFFを保持）
        let torchDesired = true;   // ★ ユーザーが点けたい状態（カメラ復帰時に復元）

        // ========================================
        // ★ 自動保存・復元処理
        // ========================================
        function saveState() {
            try {
                // ★ V16.4: 現在のセッションIDへ保存（点検開始ごとに新IDが割当）
                if (!activeSessionId) activeSessionId = newSessionId();
                const now = new Date().toISOString();
                const sessions = loadSessions();
                const prev = sessions[activeSessionId];
                const state = {
                    staffId: staffId,
                    shopId: shopId,
                    allData: allData,
                    currentData: currentData,
                    currentStep: currentStep,
                    prevRom1: prevRom1,
                    prevRom3: prevRom3,
                    startedAt: (prev && prev.startedAt) ? prev.startedAt : now,
                    savedAt: now
                };
                sessions[activeSessionId] = state;
                writeSessions(sessions);
                updateAutosaveDisplay();

        //   ・withRetry=false でキーボード表示中の巻き戻り事故を回避

        function scrollToTopInstant(withRetry) {

                try {

                if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
                if (document.documentElement) document.documentElement.scrollTop = 0;
                if (document.body) document.body.scrollTop = 0;
            };

            doScroll();
            if (window.requestAnimationFrame) requestAnimationFrame(doScroll);
            if (withRetry !== false) setTimeout(doScroll, 120);

        function initAudio() {

            }
        }

        function playScanBeep() {
            try {
                if (!audioContext) initAudio();
                if (!audioContext) return;

                if (audioContext.state === "suspended") {
                    audioContext.resume();
                }

                const now = audioContext.currentTime;
                const notes = [880, 1175, 1568];

                notes.forEach((freq, i) => {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();

                    osc.type = "sine";
                    osc.frequency.setValueAtTime(freq, now + i * 0.06);

                    gain.gain.setValueAtTime(0.12, now + i * 0.06);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.08);

                    osc.connect(gain);
                    gain.connect(audioContext.destination);

                    osc.start(now + i * 0.06);
                    osc.stop(now + i * 0.06 + 0.08);
                });

            } catch (e) {
                console.error("音再生失敗", e);
            }
        }

        async function initScanner() {
            // ★ V15.7修正: CDN(html5-qrcode)を async 読込にしたため、
            //   点検開始が早すぎるとまだ未定義の可能性がある。読込完了まで最大5秒リトライ。
            if (typeof Html5Qrcode === 'undefined') {
                for (let i = 0; i < 25 && typeof Html5Qrcode === 'undefined'; i++) {
                    await new Promise(r => setTimeout(r, 200));
                }
                if (typeof Html5Qrcode === 'undefined') {
                    alert("カメラ機能の読み込みに失敗しました。\n通信環境を確認し、ページを再読み込みしてください。");
                    return;
                }

            if (html5QrCode) {
                try {
                    await html5QrCode.stop();
                } catch (e) {}

            torchOn = false;
            torchDesired = true; // ★ V16.7: カメラ再起動時は初期値ON に戻す
            updateTorchButton();
            getTorchButtons().forEach(b => b.style.display = 'none');

            html5QrCode = new Html5Qrcode("reader", { useBarCodeDetectorIfSupported: true });

            const config = {
                fps: 30,
                videoConstraints: { facingMode: "environment" },
                qrbox: (w, h) => {
                    return { width: w * 0.75, height: h * 0.75 };
                }
            };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                (text) => {

            ).then(() => {
                setTimeout(checkTorchSupport, 500);
            }).catch(e => console.error(e));

        // ========================================
        // ★ V17.7: 台番QRの店舗チェック
        // ----------------------------------------
        // 目的：
        //   点検開始時に人間が入力した「店舗番号」と、
        //   実際に読み取った台番QR（6桁数字）の先頭2桁＝店舗番号が
        //   別の店舗を指している場合に赤警告を出す。
        //   （店舗を切り替え忘れて別店舗の台をスキャンする事故を防ぐ）
        //
        // 重要：
        //   1つの店舗が2つ以上の店舗番号を持つケースがある。
        //   （例：01成田 は 01 と 81 の両方。09潮来 は 09 / 10 / 82）
        //   したがって「番号が一致するか」ではなく
        //   「同じ店舗（グループ）を指しているか」で判定する。
        //
        // 判定できないときは警告しない（＝従来どおり通す）。
        //   ・台番QRが6桁でない（先頭2桁を店舗番号とみなせない）
        //   ・店舗番号が対応表に無い（新店・カスタム番号など）
        // ========================================

        // 別番号 → 代表番号（＝店舗リストの基本の店舗番号）への変換表
        //   ※ 出典: 店舗リスト.xlsx（Store_Number / Store_Name）
        //   ※ 規則性は無い（+80 ではない）ので個別に持つ。店舗追加時はここに追記する。
        const STORE_ALIAS_TO_BASE = {
            "81": "01", // 01成田
            "10": "09", // 09潮来（枝番）
            "82": "09", // 09潮来
            "84": "16", // 16木更津
            "85": "18", // 18神栖
            "86": "20", // 20多古
            "87": "22", // 22葉山
            "88": "23", // 23鹿嶋2
            "89": "28", // 28八日市場
            "90": "34", // 34奥野谷
            "92": "43", // 43大和
            "93": "44"  // 44淵野辺
        };

        // 店舗番号 → 代表番号（グループキー）。未知の番号はそのまま返す。
        function storeGroupOf(id) {
            if (!id) return null;
            const key = String(id).trim();
            if (!/^\d{1,2}$/.test(key)) return null;
            const norm = (key.length === 1) ? ("0" + key) : key;   // "1" → "01"
            return STORE_ALIAS_TO_BASE[norm] || norm;
        }

        // 代表番号 → 表示名（店舗リストに無ければ「店舗XX」と出す）
        function storeNameOf(baseId) {
            if (!baseId) return "";
            return shopList[baseId] || ("店舗" + baseId);
        }

        // その店舗番号が対応表（shopList or 別番号表）に載っているか
        //   載っていない番号は「判定不能」として警告を出さない
        function isKnownStoreNumber(id) {
            const norm = (String(id).length === 1) ? ("0" + id) : String(id);
            return !!shopList[norm] || !!STORE_ALIAS_TO_BASE[norm];
        }

        // 台番QR（6桁数字）から店舗番号（先頭2桁）を取り出す。6桁以外は null。
        function storeNoFromMachineId(value) {
            if (typeof value !== "string" && typeof value !== "number") return null;
            const v = String(value).trim();
            if (!/^\d{6}$/.test(v)) return null;   // 6桁のときだけ店舗番号として扱う
            return v.slice(0, 2);
        }

        // 台番の確認モーダルに出す警告を決める
        //   戻り値: { warn: true/false, msg: 表示HTML or null }
        function machineIdConfirmWarning(value) {
            const scannedNo = storeNoFromMachineId(value);
            if (!scannedNo) return { warn: false, msg: null };          // 6桁でない＝判定不能

            // 入力側（人間が選んだ店舗）が未知なら判定しない
            if (!shopId || !isKnownStoreNumber(shopId)) return { warn: false, msg: null };
            // QR側の店舗番号が未知なら判定しない（新店・誤読の可能性もあるが従来どおり通す）
            if (!isKnownStoreNumber(scannedNo)) return { warn: false, msg: null };

            const gInput = storeGroupOf(shopId);
            const gScan = storeGroupOf(scannedNo);
            if (!gInput || !gScan || gInput === gScan) return { warn: false, msg: null }; // 同じ店舗＝OK

            // ここまで来たら「別の店舗」の台番QR
            return {
                warn: true,
                msg: "\u26a0 店舗が一致しません<br>" +
                     "選択中：" + escHtml(shopId) + " " + escHtml(storeNameOf(gInput)) + "<br>" +
                     "QR：" + escHtml(scannedNo) + " " + escHtml(storeNameOf(gScan)) + "<br>" +
                     "この台を登録して良いですか？"
            };
        }

        function isValidSealQr(value) {
            return typeof value === "string" && /^B/i.test(value);
        }

        function isInvalidMainBoardQr(value) {
            return typeof value === "string" && /^BISHOP/i.test(value);
        }

        const SEAL_PREFIX = "BISHOP";
        const SEAL_HISTORY_LS_KEY = "mainboardSealHistoryV1";   // 端末で学習した封印

        // "04240518201703" → "BISHOP04240518201703" / "=XXXX" → "XXXX"
        function decodeSeal(token) {
            if (typeof token !== "string" || !token) return "";
            return (token.charAt(0) === "=") ? token.slice(1) : (SEAL_PREFIX + token);
        }
        function encodeSeal(v) {
            const s = String(v || "").trim();
            if (!s) return "";
            return s.toUpperCase().indexOf(SEAL_PREFIX) === 0 ? s.slice(SEAL_PREFIX.length) : ("=" + s);
        }
        function normSeal(v) {
            return String(v == null ? "" : v).trim().toUpperCase();
        }

        function loadLocalSealHistory() {
            try { return JSON.parse(localStorage.getItem(SEAL_HISTORY_LS_KEY)) || {}; }
            catch (e) { return {}; }
        }

        // 台を1台登録し終えたときに、この端末の実績として記録する（次回はこれが最優先）
        function saveSealHistoryEntry(mainBoardQr, seals) {
            const key = normalizeQrKey(mainBoardQr);
            if (!key || mainBoardQr === "なし") return;
            const list = (seals || []).map(normSeal).filter(function (v) { return v && v !== "なし"; });
            if (list.length === 0) return;   // 封印なしでは上書きしない
            try {
                const h = loadLocalSealHistory();
                h[key] = list.map(encodeSeal).join(",");
                localStorage.setItem(SEAL_HISTORY_LS_KEY, JSON.stringify(h));
            } catch (e) {}
        }

        // 前回の封印の並びを取り出す。無ければ null
        //   端末で学習した履歴 > 埋め込み履歴 の順（より新しい実績を優先）
        function lookupSealHistory(mainBoardQr) {
            const key = normalizeQrKey(mainBoardQr);
            if (!key || mainBoardQr === "なし") return null;
            const local = loadLocalSealHistory();
            const raw = local[key] || MAINBOARD_SEAL_HISTORY[key] || null;
            if (!raw) return null;
            const list = String(raw).split(",").map(decodeSeal).filter(Boolean).map(normSeal);
            return list.length ? list : null;
        }

        // ★ 現在の台の「前回の封印」。②主基板を読んだ時点で決まる
        let expectedSeals = null;

        // ----------------------------------------------------------------
        // ★ V18.8: 前回の封印と、今スキャン済みの封印を突き合わせる
        //   戻り値 { state, expected, scanned, okList, waitList, newList }
        //     state: 'none'    … 前回の記録が無い（初回の台）
        //            'wait'    … 前回の封印にまだ読めていないものがある（作業中）
        //            'match'   … 前回とちょうど同じ
        //            'added'   … 前回の分は全部あり、さらに増えている（増設）
        //   ※ 枚数ではなく「番号の集合」で見る。
        //      履歴を調べたところ、変化の3分の1は「既存はそのままで1枚追加」だった。
        //      枚数一致だけで判定すると、正常な増設まで警告になってしまう。
        // ----------------------------------------------------------------
        function compareSeals() {
            const scanned = ((currentData && currentData.seals) ? currentData.seals : [])
                .map(normSeal).filter(function (v) { return v && v !== "なし"; });

            if (!expectedSeals || expectedSeals.length === 0) {
                return { state: 'none', expected: [], scanned: scanned, okList: [], waitList: [], newList: scanned };
            }

            const okList = [], waitList = [];
            expectedSeals.forEach(function (v) {
                (scanned.indexOf(v) >= 0 ? okList : waitList).push(v);
            });
            const newList = scanned.filter(function (v) { return expectedSeals.indexOf(v) < 0; });

            let state;
            if (waitList.length > 0) state = 'wait';
            else if (newList.length > 0) state = 'added';
            else state = 'match';

            return { state: state, expected: expectedSeals, scanned: scanned,
                     okList: okList, waitList: waitList, newList: newList };
        }

        // 封印番号は長いので、末尾6桁を太字にして目で追えるようにする
        function sealLabel(v) {
            const s = escHtml(v);
            return (s.length > 6)
                ? (s.slice(0, s.length - 6) + '<b>' + s.slice(-6) + '</b>')
                : ('<b>' + s + '</b>');
        }

        // ----------------------------------------------------------------
        // ★ V18.8: 照合パネルの描画（④封印スキャンのときだけ出す）
        // ----------------------------------------------------------------
        function renderSealHistoryNote() {
            const box = document.getElementById('seal-history-note');
            if (!box) return;

            box.classList.remove('sh-state-wait', 'sh-state-match', 'sh-state-added', 'sh-state-missing');

            // ④以外、または前回の記録が無い台では何も出さない
            if (currentStep !== 4 || !expectedSeals || expectedSeals.length === 0) {
                box.style.display = 'none';
                box.innerHTML = '';
                return;
            }

            const c = compareSeals();
            let title, cls;
            if (c.state === 'match') {
                title = '🟢 前回と同じ封印です（' + c.expected.length + '枚）';
                cls = 'sh-state-match';
            } else if (c.state === 'added') {
                title = '🔵 前回の' + c.expected.length + '枚は全部あります（新規 +' + c.newList.length + '枚）';
                cls = 'sh-state-added';
            } else {
                title = '前回の封印 ' + c.expected.length + '枚中 ' + c.okList.length + '枚を確認（残り ' + c.waitList.length + '枚）';
                cls = 'sh-state-wait';
            }
            box.classList.add(cls);

            let html = '<div class="sh-title">' + title + '</div>';
            c.expected.forEach(function (v) {
                const ok = c.okList.indexOf(v) >= 0;
                html += '<div class="sh-row">' +
                        '<span class="' + (ok ? 'sh-ok' : 'sh-wait') + '">' + (ok ? '✓' : '□') + '</span> ' +
                        sealLabel(v) + '</div>';
            });
            c.newList.forEach(function (v) {
                html += '<div class="sh-row"><span class="sh-new">＋</span> ' + sealLabel(v) + '（新規）</div>';
            });

            box.innerHTML = html;
            box.style.display = 'block';
        }

        function loadLocalRomHistory() {
            try {
                return JSON.parse(localStorage.getItem(ROM_HISTORY_LS_KEY)) || {};
            } catch (e) {
                return {};
            }
        }

        // ★ V15.6: QRキー正規化（前後空白除去＋大文字化）。辞書キーも大文字で焼き込み済み
        function normalizeQrKey(qr) {
            return (typeof qr === "string") ? qr.trim().toUpperCase() : "";
        }

        // ROM確定時に呼ばれ、主基板QR→ROMをlocalStorageへ追記（形式不正・主基板なしは記録しない）
        function saveRomHistoryEntry(mainBoardQr, romValue) {
            const key = normalizeQrKey(mainBoardQr);
            if (!key || mainBoardQr === "なし") return;
            if (typeof romValue !== "string" || !ROM_VALUE_PATTERN.test(romValue)) return;
            try {
                const h = loadLocalRomHistory();
                h[key] = romValue;
                localStorage.setItem(ROM_HISTORY_LS_KEY, JSON.stringify(h));
            } catch (e) {}
        }

        function lookupRomHistory(mainBoardQr) {
            const key = normalizeQrKey(mainBoardQr);
            if (!key || mainBoardQr === "なし") return null;
            const local = loadLocalRomHistory();
            // 旧バージョンで学習した非正規化キーも拾う（後方互換）
            return local[key] || local[mainBoardQr] || MAINBOARD_ROM_HISTORY[key] || null;
        }

        // ★ V16.9: 主基板QRの「相似度」によるROM予測入力
        //   目的: 完全一致の実績が無い主基板QRでも、過去QRと十分似ていれば

        //            2. 埋め込み履歴の中で「登場順が後ろ」のもの
