        //       （同じ相似度なら、より新しい実績を採用）
        //
        //   すべて先頭の定数で調整可（0 や false にすれば無効化できる）
        // ================================================================
        const FUZZY_ENABLED        = true;  // 予測入力そのもののON/OFF
        const FUZZY_SIM_THRESHOLD  = 0.8;   // 相似度のしきい値（0.8 = 8割）
        const FUZZY_PREFIX_LEN     = 2;     // 先頭N文字の一致を必須にする（0で無効）
        const FUZZY_SHAPE_CHECK    = true;  // QR形式チェック（falseで無効化＝V17.2相当）

        // ★ V17.3: 主基板QRの形式を判定して 'A' / 'B' / null を返す
        //   'A'  … 「/」なし  [英字][数字][英字2][数字9]   例 M2JB260511788（13桁）
        //   'B'  … 「/」あり  [数字][英字][数字2]/[数字5]  例 1K56/79393  （10桁）
        //   null … どちらでもない＝読み取りミスの疑い
        //          （数字だけ / 空白混入 / 桁数違い / 20桁 など）
        const RE_MB_SHAPE_A = /^[A-Z]\d[A-Z]{2}\d{9}$/;
        const RE_MB_SHAPE_B = /^\d[A-Z]\d{2}\/\d{5}$/;

        function mainboardQrShape(qs) {
            if (typeof qs !== "string" || !qs) return null;
            if (/[\s\u3000]/.test(qs)) return null;   // 半角/全角スペース混入は誤読
            if (RE_MB_SHAPE_A.test(qs)) return 'A';
            if (RE_MB_SHAPE_B.test(qs)) return 'B';
            return null;
        }

        // ★ V16.9: 予測入力の状態（ROM確定・次の台へ移る際にクリア）
        let fuzzyFilledRom = null;   // 予測入力したROM値（例 "2541KY454"）
        let fuzzyMatchedQr = null;   // 予測の照合元になった過去の主基板QR

        // ----------------------------------------------------------------
        // ★ V16.9: レーベンシュタイン距離（maxDist超で即打ち切り＝高速化）
        //   ・戻り値: 距離（0以上） / maxDistを超えていたら -1
        //   ・対角バンド(±maxDist)だけ計算するので4,800件走査でも数ms程度
        // ----------------------------------------------------------------
        function levenshteinWithin(a, b, maxDist) {
            const la = a.length, lb = b.length;

            // 文字数差だけで既にmaxDistを超えるなら計算不要
            if (Math.abs(la - lb) > maxDist) return -1;
            if (la === 0) return (lb <= maxDist) ? lb : -1;
            if (lb === 0) return (la <= maxDist) ? la : -1;

            const BIG = maxDist + 1;
            let prev = new Array(lb + 1);
            let cur  = new Array(lb + 1);

            for (let j = 0; j <= lb; j++) prev[j] = j;

            for (let i = 1; i <= la; i++) {
                cur[0] = i;

                // このi行で計算する列の範囲（バンド）
                const from = Math.max(1, i - maxDist);
                const to   = Math.min(lb, i + maxDist);

                // バンド外の左隣は「大きい値」で埋めておく（参照されるため必須）
                if (from > 1) cur[from - 1] = BIG;

                let rowMin = BIG;
                const ca = a.charCodeAt(i - 1);

                for (let j = from; j <= to; j++) {
                    const cost = (ca === b.charCodeAt(j - 1)) ? 0 : 1;
                    let v   = prev[j - 1] + cost;   // 置換 or 一致
                    const d = prev[j] + 1;          // 削除
                    const s = cur[j - 1] + 1;       // 挿入
                    if (d < v) v = d;
                    if (s < v) v = s;
                    cur[j] = v;
                    if (v < rowMin) rowMin = v;
                }

                // バンド右側も大きい値で埋める
                for (let j = to + 1; j <= lb; j++) cur[j] = BIG;

                // この行の最小値がmaxDistを超えたら以降改善しない＝打ち切り
                if (rowMin > maxDist) return -1;

                const t = prev; prev = cur; cur = t;
            }

            const dist = prev[lb];
            return (dist > maxDist) ? -1 : dist;
        }

        // ----------------------------------------------------------------
        // ★ V16.9: 相似度が最も高い過去主基板QRを探す
        //   戻り値:
        //     null … 相似度しきい値を超える候補が無い
        //     {qr, rom, sim, dist, tieTotal, tieSame, romVariants}
        //        qr          … 予測の照合元になった過去の主基板QR
        //        rom         … 予測ROM値（同率候補のうち一番新しい実績）
        //        sim         … 相似度(0〜1)
        //        tieTotal    … 同率トップの候補総数
        //        romVariants … 同率トップに含まれるROM値の種類数（2以上なら要注意）
        // ----------------------------------------------------------------
        function findFuzzyRomHistory(mainBoardQr) {
            const key = normalizeQrKey(mainBoardQr);
            if (!key || mainBoardQr === "なし") return null;

            // ★ V17.3: スキャンしたQR自体が既知の2形式に合致しなければ予測しない
            //   （読み取りミスのQRを元に予測しても意味がない＝前回入力値のまま残す）
            const keyShape = mainboardQrShape(key);
            if (FUZZY_SHAPE_CHECK && !keyShape) return null;

            const pre = (FUZZY_PREFIX_LEN > 0) ? key.substring(0, FUZZY_PREFIX_LEN) : "";
            const cands = [];

            // priority: 2 = 端末で学習した履歴（新しい） / 1 = 埋め込み履歴
            // idx: 辞書内の登場順（大きいほど新しい登録。V18.1以降は「取得日が新しい」順に焼き込んでいる）
            let idx = 0;
            const scan = function (dict, priority) {
                if (!dict) return;
                for (const rawKey in dict) {
                    idx++;
                    if (!Object.prototype.hasOwnProperty.call(dict, rawKey)) continue;

                    const k = normalizeQrKey(rawKey);
                    if (!k || k === key) continue;                       // 完全一致は別処理
                    // ★ V17.3: 照合元の候補も形式チェック（辞書に混入している誤スキャンQRを排除）
                    //   さらに形式A同士・形式B同士でしか比較しない
                    if (FUZZY_SHAPE_CHECK && mainboardQrShape(k) !== keyShape) continue;
                    if (pre && k.substring(0, FUZZY_PREFIX_LEN) !== pre) continue; // 機種違いは除外

                    const rom = dict[rawKey];
                    if (typeof rom !== "string" || !ROM_VALUE_PATTERN.test(rom)) continue;

                    // このペアで許容される最大編集距離（相似度しきい値から逆算）
                    const maxLen = Math.max(key.length, k.length);
                    const maxAllowed = Math.floor(maxLen * (1 - FUZZY_SIM_THRESHOLD) + 1e-9);
                    if (maxAllowed < 1) continue;   // 1文字も違えない＝実質完全一致のみ

                    const dist = levenshteinWithin(key, k, maxAllowed);
                    if (dist < 0) continue;         // しきい値未満

                    cands.push({
                        qr: k,
                        rom: rom,
                        dist: dist,
                        sim: 1 - (dist / maxLen),
                        priority: priority,
                        idx: idx           // 登場順（大きい＝新しい）
                    });
                }
            };

            try { scan(loadLocalRomHistory(), 2); } catch (e) {}
            scan(MAINBOARD_ROM_HISTORY, 1);

            if (!cands.length) return null;

            // --- 並び順 = 相似度降順 → 端末学習優先 → 登場順が後ろ（＝一番新しい実績） ---
            cands.sort(function (x, y) {
                if (Math.abs(y.sim - x.sim) > 1e-9) return y.sim - x.sim; // ① 相似度が高い
                if (y.priority !== x.priority) return y.priority - x.priority; // ② 端末学習を優先
                return y.idx - x.idx;                                     // ③ 一番新しい登録
            });

            const top = cands[0];   // ← ①〜③で1件に確定（毎回同じ結果になる）

            // 同率トップが何件あり、ROMが何種類に分かれているかを警告表示用に集計
            const ties = cands.filter(function (c) { return Math.abs(c.sim - top.sim) < 1e-9; });
            const romSet = {};
            ties.forEach(function (c) { romSet[c.rom] = true; });

            return {
                qr: top.qr,
                rom: top.rom,
                sim: top.sim,
                dist: top.dist,
                tieTotal: ties.length,
                romVariants: Object.keys(romSet).length
            };
        }

        // ----------------------------------------------------------------
        // ★ V16.9: 予測入力バナー（オレンジ）の表示切替
        // ----------------------------------------------------------------
        function setRomFuzzyNote(html) {
            const note = document.getElementById('rom-fuzzy-note');
            if (!note) return;
            if (html) {
                note.innerHTML = html;
                note.style.display = 'block';
            } else {
                note.innerHTML = '';
                note.style.display = 'none';
            }
        }

        // ----------------------------------------------------------------
        // ★ V16.9: 予測入力時のROM欄の色（完全一致=赤 と区別するためオレンジ）
        // ----------------------------------------------------------------
        function setRomFuzzyHighlight(on) {
            ['rom-1', 'rom-3'].forEach(function (id) {
                const el = document.getElementById(id);
                if (!el) return;
                if (on) {
                    // ★ V17.0: バナー(紫)と色を揃える。完全一致=赤 との区別を維持
                    el.style.backgroundColor = '#f5f3ff';
                    el.style.borderColor = '#7c3aed';
                    el.style.borderWidth = '2px';
                    el.style.borderStyle = 'solid';
                } else {
                    el.style.backgroundColor = '';
                    el.style.borderColor = '';
                    el.style.borderWidth = '';
                    el.style.borderStyle = '';
                }
            });
        }

        // ----------------------------------------------------------------
        // ★ V16.9: 予測入力の状態を全部クリア（次の台へ／主基板なし／復元時）
        // ----------------------------------------------------------------
        function clearFuzzyRomState() {
            fuzzyFilledRom = null;
            fuzzyMatchedQr = null;
            setRomFuzzyNote(null);
            setRomFuzzyHighlight(false);
        }

        // ----------------------------------------------------------------
        // ★ V16.9: 相似度80%超の過去QRからROMを予測入力
        //   ・完全一致でヒットしなかったときだけ呼ぶ
        //   ・予測入力した場合 true / しなかった場合 false を返す
        //   ・false のときROM欄は一切触らない＝従来どおり前回入力値が残る
        // ----------------------------------------------------------------
        function applyRomFromFuzzyHistory(mainBoardQr) {
            clearFuzzyRomState();
            if (!FUZZY_ENABLED) return false;

            const hit = findFuzzyRomHistory(mainBoardQr);
            if (!hit) return false;

            // 相似度を小数第1位までのパーセント表記に
            const pct = (Math.round(hit.sim * 1000) / 10).toFixed(1);

            const m = hit.rom.match(ROM_VALUE_PATTERN);
            if (!m) return false;

            const r1   = m[1];
            const type = m[2];
            const r3   = (type === "KY") ? (m[3] || "") : "";

            setRomTypeWithRom3(type);   // KY/EAI切替（EAIならROM③クリア込み）

            const rom1 = document.getElementById('rom-1');
            const rom3 = document.getElementById('rom-3');
            if (rom1) rom1.value = r1;
            if (rom3) rom3.value = r3;

            // 予測値を記憶（ROM確定時の判定・表示に使用）
            fuzzyFilledRom = hit.rom;
            fuzzyMatchedQr = hit.qr;

            // ★ V17.1: 「同じ相似度の候補が…」の注記は表示しない（バナーを最小限に保つ）
            //   同率候補の件数・ROM種類数は hit.tieTotal / hit.romVariants に入っているので
            //   将来また出したくなったらここで組み立てて本文に足すだけで済む
            // ★ V17.2: 表示は指定の2行のみ。
            //   一致度・照合元QRは pct / hit.qr / hit.rom に入っているので、
            //   また出したくなったらこの文字列に足すだけで済む。
            setRomFuzzyNote(
                '🤖 過去データからROMを予測しました。<br>' +
                '完全一致の実績ではありません。必ず実物と照合してください。'
            );
            setRomFuzzyHighlight(true);
            showScanToast('🤖 過去データからROMを予測（要照合）');
            return true;
        }

        // ★ V15.6: 過去取得済み自動入力時の見た目（赤文字＋入力欄の色）を一括切替
        function setRomHistoryHighlight(on) {
            const note = document.getElementById('rom-history-note');
            if (note) note.style.display = on ? 'block' : 'none';
            ['rom-1', 'rom-3'].forEach(function (id) {
                const el = document.getElementById(id);
                if (!el) return;
                if (on) {
                    el.style.backgroundColor = '#fff0f0';
                    el.style.borderColor = '#dc2626';
                    el.style.borderWidth = '2px';
                    el.style.borderStyle = 'solid';
                } else {
                    el.style.backgroundColor = '';
                    el.style.borderColor = '';
                    el.style.borderWidth = '';
                    el.style.borderStyle = '';
                }
            });
        }

        // 履歴ヒット時: KY/EAI切替＋ROM①③を自動入力してtrueを返す
        function applyRomFromHistory(mainBoardQr) {
            // ★ V15.6/V15.6: 毎回リセット（前の台の自動入力状態・赤文字・欄の色を持ち越さない）
            autoFilledRom = null;
            setRomHistoryHighlight(false);
            clearFuzzyRomState(); // ★ V16.9: 予測入力の表示・状態も毎回リセット

            const romValue = lookupRomHistory(mainBoardQr);
            if (!romValue) return false;

            const m = romValue.match(ROM_VALUE_PATTERN);
            if (!m) return false;

            const r1 = m[1];
            const type = m[2];
            const r3 = (type === "KY") ? (m[3] || "") : "";

            setRomTypeWithRom3(type);   // KY/EAI切替（EAIならROM③クリア込み）

            const rom1 = document.getElementById('rom-1');
            const rom3 = document.getElementById('rom-3');
            if (rom1) rom1.value = r1;
            if (rom3) rom3.value = r3;

            // ★ V15.6: 自動入力したROMを記憶＋赤文字を常時表示（POP消失対策）
            // ★ V15.6: 入力欄の背景・枠色も変更
            autoFilledRom = romValue;
            setRomHistoryHighlight(true);

            showScanToast("登録済み主基板：ROM自動入力（要確認）");
            return true;
        }

        function isSuspiciousMainBoardValue(value) {
            return typeof value === "string" && /^\d{6}$/.test(value);
        }

        // ================================================================
        // ★ V17.4: 主基板QRの「読み取りミス」を確認画面で警告
        //   背景:
        //     履歴xlsx 5,264行を調べたところ、誤スキャン由来のQRが20件混入していた
        //       例) 94270 / 97410（数字だけ）
        //           09752A / 0974K0 / 0973G0（途中まで）
        //           G44CY3E61A / GCB8RPGCTE / N19D74DD22（別のQRを読んだ）
        //           BBN1R251003W6K220203 / P2573002172030DM0683（20桁）
        //           23 0225096 / 12 0047000（空白混入）
        //           AG0233809 / AB0514785 / 1O26017652〜55（形式ズレ）
        //     → 入口で気づけるように、読んだ直後の確認画面で赤警告を出す。
        //
        //   方針:
        //     ・警告のみ。「OK」を押せば従来どおり登録できる
        //       （新機種で本当に新しい形式が出た場合に現場が止まらないようにするため）
        //     ・判定は V17.3 の mainboardQrShape()（形式A=13桁 / 形式B=「/」あり10桁）
        //     ・MAINBOARD_SHAPE_WARN = false でこの警告だけOFFにできる
        // ================================================================
        const MAINBOARD_SHAPE_WARN = true;

        const MAINBOARD_SHAPE_WARN_HTML =
            '⚠️ 主基板QRの形式が正しくありません<br>' +
            '<span style="font-size:15px;">読み取りミスの可能性があります。<br>' +
            '「戻る」で もう一度読み取ってください。<br>' +
            '実物のQRがこの表記どおりなら「OK」で進めます。</span>';

        // 確認画面に出す警告を決める
        //   戻り値 {warn:true/false, msg:HTML or null}
        //     ① 6桁の数字     → 従来の「台番号と誤読していませんか？」（msg=null＝既定文言）
        //     ② 形式に不一致  → 上記の形式警告
        //     ③ 正常          → 警告なし
        function mainboardConfirmWarning(value) {
            if (isSuspiciousMainBoardValue(value)) return { warn: true, msg: null };

            if (MAINBOARD_SHAPE_WARN) {
                const qs = normalizeQrKey(value);
                // 「なし」（主基板なし）は skipStep 経由なのでここには来ないが念のため除外
                if (qs && value !== "なし" && !mainboardQrShape(qs)) {
                    return { warn: true, msg: MAINBOARD_SHAPE_WARN_HTML };
                }
            }
            return { warn: false, msg: null };
        }

        function focusRomInput() {
            const rom1 = document.getElementById('rom-1');
            if (!rom1) return;

            try {
                rom1.focus({ preventScroll: true });
            } catch (e) {
                rom1.focus();
            }

            rom1.click();
            rom1.select();
        }

        function focusRom3WithKeyboard() {
            const rom3 = document.getElementById('rom-3');
            if (!rom3) return;

            try {
                rom3.focus({ preventScroll: true });
            } catch (e) {
                rom3.focus();
            }

            rom3.click();
            rom3.select();

            setTimeout(() => {
                try {
                    rom3.focus({ preventScroll: true });
                } catch (e) {
                    rom3.focus();
                }

                rom3.click();
                rom3.select();
            }, 50);
        }

        function getRomType() {
            const btn = document.getElementById('rom-select');
            return (btn && btn.dataset.value) ? btn.dataset.value : "KY";
        }

        function setRomType(value) {
            const btn = document.getElementById('rom-select');
            if (!btn) return;
            btn.dataset.value = value;
            btn.innerText = value;
        }

        function toggleRomType() {
            const next = getRomType() === "KY" ? "EAI" : "KY";
            setRomType(next);

            const rom3 = document.getElementById('rom-3');

            if (next === "EAI") {
                if (rom3) rom3.value = "";

                // ★ V14.0: ROM①が4桁なら自動確定（旧動作を復活）
                //    4桁でなければROM①へフォーカスし、テンキーを自動表示（V13.9動作）
                const rom1 = document.getElementById('rom-1');
                const r1 = rom1 ? (rom1.value || "").trim() : "";

                if (currentStep === 3 && r1.length === 4) {
                    setTimeout(() => handleManualInput(), 120);
                } else {
                    setRomKbMode("numeric");
                    setTimeout(() => focusRomInput(), 60);
                }
            } else if (next === "KY") {
                // ★ KYに切り替えたらROM①へカーソル移動＋既存値を全選択
                setTimeout(() => focusRomInput(), 60);
            }
        }

        // ========================================
        // ★ ROM入力欄のキーボードモード（数字 / 通常(音声)）
        //    選択をlocalStorageに保存し、次回も既定として復元
        // ========================================
        const ROM_KB_KEY = "rom_keyboard_mode"; // "numeric" or "voice"

        function getRomKbMode() {
            try {
                return localStorage.getItem(ROM_KB_KEY) || "numeric";
            } catch (e) {
                return "numeric";
            }
        }

        function applyRomKbMode() {
            const mode = getRomKbMode();
            const im = (mode === "numeric") ? "numeric" : "text";

            ['rom-1', 'rom-3'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.setAttribute('inputmode', im);
            });

            const btn = document.getElementById('rom-kb-toggle');
            if (btn) {
                if (mode === "numeric") {
                    btn.innerText = "⌨ 数字入力モード（タップで🎤音声）";
                    btn.classList.add('kb-numeric');
                    btn.classList.remove('kb-voice');
                } else {
                    btn.innerText = "🎤 音声入力モード（タップで⌨数字）";
                    btn.classList.add('kb-voice');
                    btn.classList.remove('kb-numeric');
                }
            }
        }

        function setRomKbMode(mode) {
            try {
                localStorage.setItem(ROM_KB_KEY, mode);
            } catch (e) {}
            applyRomKbMode();
        }

        function toggleRomKbMode() {
            setRomKbMode(getRomKbMode() === "numeric" ? "voice" : "numeric");

            // ★ inputmode変更を反映しつつキーボードを出したままにする。
            //    ボタンはonmousedownでフォーカスを奪わないため、ここで同期的に
            //    blur→focusすると（ユーザー操作内なので）キーボードが再表示される。
            const rom1 = document.getElementById('rom-1');
            if (rom1) {
                rom1.blur();
                try {
                    rom1.focus({ preventScroll: true });
                } catch (e) {
                    rom1.focus();
                }
                try { rom1.select(); } catch (e) {}
            }
        }

        function handleRomTypeChange() {
            const rom3 = document.getElementById('rom-3');
            if (!rom3) return;

            const type = getRomType();

            if (type === "EAI") {
                rom3.value = "";
            } else if (type === "KY") {
                focusRom3WithKeyboard();
            }
        }

        // ★ ROM欄を数字だけに正規化（全角→半角、音声入力の空白/記号を除去）
        function sanitizeRomDigits(el) {
            if (!el) return "";
            let v = el.value || "";
            v = v.replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
            v = v.replace(/[^0-9]/g, "");
            if (el.value !== v) el.value = v;
            return v;
        }

        // ========================================
        // ★ V14.4: 音声入力(ディクテーション)の文字重複バグ対策
        //   症状: 「2456」と発音すると「242456」のように途中経過が二重に残る。
        //   原因: 変換確定前(入力途中)に oninput で value を書き換える(sanitize)と、
        //         iOSが途中経過＋確定文字を二重挿入してしまう。
        //   対策: ① compositionstart～end の「変換中」は value を一切触らない／自動送りしない
        //         ② 音声モードは入力が落ち着いてから(デバウンス)に正規化＋自動送りを実行
        //         ③ 数字モードは従来どおり即時動作（入力速度を落とさない）
        // ========================================
        const romComposing = { 'rom-1': false, 'rom-3': false };
        const romInputTimer = { 'rom-1': null, 'rom-3': null };
        const ROM_VOICE_DEBOUNCE_MS = 600;

        function isVoiceMode() {
            return getRomKbMode() === "voice";
        }

        // ★ ROM①/③ に変換中フラグ用リスナーを登録（onloadで一度だけ呼ぶ）
        function setupRomVoiceGuards() {
            ['rom-1', 'rom-3'].forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;

                el.addEventListener('compositionstart', () => {
                    romComposing[id] = true;
                    clearTimeout(romInputTimer[id]);
                });

                el.addEventListener('compositionend', () => {
                    romComposing[id] = false;
                    // ★ 変換確定後にまとめて正規化＋自動送り（確定前は絶対に触らない）
                    clearTimeout(romInputTimer[id]);
                    romInputTimer[id] = setTimeout(() => {
                        if (id === 'rom-1') runRom1AfterInput();
                        else runRom3AfterInput();
                    }, 80);
                });
            });
        }

        // ========================================
        // ★ V16.6: ROM①/③ スピンボタン（↑↓で±1）
        //   ・ROM① = 4桁ゼロ埋め / ROM③ = 3桁ゼロ埋め
        //   ・スピン操作では「4桁で自動フォーカス移動」「3桁で自動確定」を発火させない
        //     （手入力・音声入力での自動送りは従来どおり動作する）
        // ========================================
        const ROM_SPIN_DIGITS = { 'rom-1': 4, 'rom-3': 3 };
        const romSpinGuard = { 'rom-1': 0, 'rom-3': 0 }; // 最後にスピン操作した時刻(ms)
        const ROM_SPIN_GUARD_MS = 800;

        // スピン直後かどうか（blur等の自動送り抑止用）
        function isRomSpinGuarded(id) {
            return (Date.now() - (romSpinGuard[id] || 0)) < ROM_SPIN_GUARD_MS;
        }

        function spinRom(id, delta) {
            if (currentStep !== 3) return;

            const el = document.getElementById(id);
            if (!el) return;

            const digits = ROM_SPIN_DIGITS[id] || 4;
            const max = Math.pow(10, digits) - 1;

            // 全角→半角・数字以外除去（表示も正規化）
            const cur = sanitizeRomDigits(el);

            let n;
            if (cur === "") {
                // 空欄からは ↑ → 1 / ↓ → 0 スタート
                n = (delta > 0) ? 1 : 0;
            } else {
                n = parseInt(cur, 10) + delta;
            }

            if (isNaN(n)) n = 0;
            if (n < 0) n = 0;            // 0未満にはしない
            if (n > max) n = max;        // 桁あふれ防止

            // ★ スピンガードを立ててから value を書き換える
            romSpinGuard[id] = Date.now();

            // 途中の自動送り処理が予約されていたら破棄
            clearTimeout(romInputTimer[id]);
            romInputTimer[id] = null;

            el.value = String(n).padStart(digits, '0');

            // ※ 意図的に input イベントを dispatch しない
            //    → handleRom1Input / handleRom3Input が走らないので自動送りも発火しない
        }

        // ========================================
        // ★ V17.9: 上下キーは ROM①/ROM③ 共用にしたので、
        //   「いまどちらの欄を操作しているか」を1か所で持っておく。
        //   ・← → を押したとき、欄をタップ／フォーカスしたときに更新される
        //   ・初期値は ROM①（ROM入力に入ると①からの入力が基本のため）
        // ========================================
        let activeRomField = 'rom-1';

        // 操作対象の欄を切り替える（見た目：欄の青枠 + 十字キー中央の①/③表示）
        function setActiveRomField(id) {
            if (id !== 'rom-1' && id !== 'rom-3') return;
            activeRomField = id;

            // 選択中の欄だけ青枠にする
            ['rom-1', 'rom-3'].forEach(function (k) {
                const e = document.getElementById(k);
                if (e) {
                    if (k === id) e.classList.add('rom-active-field');
                    else e.classList.remove('rom-active-field');
                }
            });

            updateRomSwapButton();   // ★ V18.7: 切替ボタンの矢印の向きも合わせる
        }

        // ========================================
        // ★ V18.7: 欄の切替ボタン（←/→を1つに統合）
        //   ラベルは「押すとどっちへ行くか」を示す:
        //     いまROM① → 「→」（押すとROM③へ）
        //     いまROM③ → 「←」（押すとROM①へ）
        //   ※ setActiveRomField から必ず呼ばれるので、表示とカーソルがズレない
        // ========================================
        function updateRomSwapButton() {
            const btn = document.getElementById('rom-dpad-swap');
            if (!btn) return;
            btn.innerText = (activeRomField === 'rom-3') ? '←' : '→';
        }

        // 押したら反対側の欄へ移動する（移動先は全選択される）
        function toggleRomFieldSide() {
            if (currentStep !== 3) return;
            selectRomField(activeRomField === 'rom-3' ? 'rom-1' : 'rom-3');
        }

        // 十字キーの ↑ / ↓ … 選択中の欄を +1 / -1（従来の spinRom をそのまま利用）
        function spinActiveRom(delta) {
            if (currentStep !== 3) return;
            const id = (activeRomField === 'rom-3') ? 'rom-3' : 'rom-1';
            setActiveRomField(id);   // 表示を確実に同期させる
            spinRom(id, delta);
        }

        // ========================================
        // ★ V16.6: ←/→ ボタンで ROM①/ROM③ を選択（入力済み文字列は全選択）
        //   ・ボタンは onmousedown で preventDefault 済み＝キーボードを閉じない
        //   ・移動そのものが目的なので blur 由来の自動フォーカス移動は抑止
        // ========================================
        function selectRomField(id) {
            if (currentStep !== 3) return;

            const el = document.getElementById(id);
            if (!el) return;

            // ★ V17.9: 上下キーの操作対象もこの欄に切り替える
            setActiveRomField(id);

            // ★ blur起因の自動フォーカス移動(handleRom1Blur)を抑止
            romSpinGuard['rom-1'] = Date.now();

            const focusAndSelect = function () {
                try {
                    el.focus({ preventScroll: true });
                } catch (e) {
                    el.focus();
                }
                el.click();
                try {
                    el.select();
                    if (el.setSelectionRange) el.setSelectionRange(0, (el.value || "").length);
                } catch (e) {}
            };

            focusAndSelect();
            // ★ iOSはフォーカス直後に選択が解除される事があるため再適用
            setTimeout(focusAndSelect, 60);
        }

        // ROM① 入力イベント（数字モード=即時 / 音声モード=デバウンス）
        function handleRom1Input(ev) {
            if (currentStep !== 3) return;

            // ★ 変換中(音声/IME)は一切触らない＝重複入力の根本原因を断つ
            if (romComposing['rom-1'] || (ev && ev.isComposing)) return;

            if (isVoiceMode()) {
                // ★ 入力が落ち着くまで待ってから正規化＋自動送り（途中で value を書き換えない）
                clearTimeout(romInputTimer['rom-1']);
                romInputTimer['rom-1'] = setTimeout(runRom1AfterInput, ROM_VOICE_DEBOUNCE_MS);
                return;
            }

            runRom1AfterInput();
        }

        // ROM①：正規化＋4桁で自動送り（変換確定後／デバウンス後に実行）
        function runRom1AfterInput() {
            if (currentStep !== 3) return;
            if (romComposing['rom-1']) return; // まだ変換中なら何もしない

            const rom1 = document.getElementById('rom-1');
            if (!rom1) return;

            const r1 = sanitizeRomDigits(rom1);
            if (r1.length !== 4) return;

            const type = getRomType();
            if (type === "KY") {
                setTimeout(() => focusRom3WithKeyboard(), 120);
            } else if (type === "EAI") {
                setTimeout(() => handleManualInput(), 120);
            }
        }

        function handleRom1Blur() {
            if (currentStep !== 3) return;
            if (romComposing['rom-1']) return; // ★ 変換中のblurでは触らない
            if (isRomSpinGuarded('rom-1')) return; // ★ V16.6: スピン操作直後は自動送りしない

            const rom1 = document.getElementById('rom-1');
            const rom3 = document.getElementById('rom-3');

            if (!rom1 || !rom3) return;

            const r1 = sanitizeRomDigits(rom1);
            const r3 = sanitizeRomDigits(rom3);

            if (!r1) return;
            if (getRomType() !== "KY") return;
            if (r3) return;

            setTimeout(() => {
                focusRom3WithKeyboard();
            }, 100);
        }

        // ROM③ 入力イベント（数字モード=即時 / 音声モード=デバウンス）
        function handleRom3Input(ev) {
            if (currentStep !== 3) return;

            if (romComposing['rom-3'] || (ev && ev.isComposing)) return;

            if (isVoiceMode()) {
                clearTimeout(romInputTimer['rom-3']);
                romInputTimer['rom-3'] = setTimeout(runRom3AfterInput, ROM_VOICE_DEBOUNCE_MS);
                return;
            }

            runRom3AfterInput();
        }

        // ROM③：KYのみ、ROM①4桁＋ROM③3桁で自動確定
        function runRom3AfterInput() {
            if (currentStep !== 3) return;
            if (getRomType() !== "KY") return;
            if (romComposing['rom-3']) return;

            const rom1 = document.getElementById('rom-1');
            const rom3 = document.getElementById('rom-3');
            if (!rom1 || !rom3) return;

            const r1 = sanitizeRomDigits(rom1);
            const r3 = sanitizeRomDigits(rom3);

            if (r1.length !== 4) return;
            if (r3.length !== 3) return;

            setTimeout(() => handleManualInput(), 120);
        }

        function handleScannedText(value) {
            // ★ V18.6: 封印登録の確認モーダル表示中もスキャンを無視
            //   （背後で封印が増えると、モーダルに出している枚数と実際がズレるため）
            const sealOv = document.getElementById('seal-confirm-overlay');
            if (sealOv && sealOv.style.display === 'flex') {
                html5QrCode && html5QrCode.resume && html5QrCode.resume();
                return;
            }

            // ★ V14.9: 修正モーダル表示中はスキャンを無視（背後での誤登録防止）
            if (isEditOpen()) {
                html5QrCode && html5QrCode.resume && html5QrCode.resume();
                return;
            }

            if (currentStep === 1) {
                if (!isValidMachineId(value)) {
                    html5QrCode.resume();
                    return;
                }

                playScanBeep();
                pendingValue = value;

                // ★ V17.7: 選択中の店舗と台番QRの店舗が違えば赤警告付きで確認表示
                const mw = machineIdConfirmWarning(value);
                showConfirmation(value, mw.warn, mw.msg);
                return;
            }

            if (currentStep === 2) {
                if (isInvalidMainBoardQr(value)) {
                    html5QrCode.resume();
                    return;
                }

                playScanBeep();
                pendingValue = value;

                // ★ V17.4: 6桁誤読 or 形式不一致なら赤警告付きで確認表示
                const w = mainboardConfirmWarning(value);
                showConfirmation(value, w.warn, w.msg);
                return;
            }

            if (currentStep === 4) {
                if (!isValidSealQr(value)) {
                    html5QrCode.resume();
                    return;
                }

                if (currentData.seals.includes(value)) {
                    html5QrCode.resume();
                    return;
                }

                playScanBeep();
                currentData.seals.push(value);
                updateSealDisplay();
                updateUI();
                showScanToast("封印を登録しました");
                saveState(); // ★ 封印追加ごとに保存
                html5QrCode.resume();
                return;
            }
        }

        function showConfirmation(value, isWarning = false, warningMsg = null) {
            const modal = document.getElementById('confirm-modal');
            const warning = document.getElementById('warning-msg');
            const display = document.getElementById('scanned-display');

            display.innerText = value;

            // ★ V15.6: 既定メッセージ（6桁誤読）を退避し、カスタム文言を差し込めるように
            if (!warning.dataset.defaultHtml) warning.dataset.defaultHtml = warning.innerHTML;
            warning.innerHTML = warningMsg || warning.dataset.defaultHtml;

            if (isWarning) {
                warning.style.display = 'block';
                modal.style.border = '4px solid #dc2626';
                modal.style.background = '#fff5f5';
                display.style.color = '#dc2626';
            } else {
                warning.style.display = 'none';
                modal.style.border = 'none';
                modal.style.background = '#fff';
                display.style.color = '#ff4500';
            }

            document.getElementById('confirm-overlay').style.display = 'flex';
            scrollToTopInstant(); // ★ V16.6
        }

        function approveValue() {
            document.getElementById('confirm-overlay').style.display = 'none';

            if (currentStep === 1) {
                currentData.machineId = pendingValue;
                currentStep = 2;
                updateUI();
                html5QrCode.resume();
                saveState(); // ★
                return;
            }

            if (currentStep === 2) {
                currentData.mainBoardId = pendingValue;
                const typeMatched = applyRomTypeFromMainBoard(pendingValue); // ★ V13.8: KY/EAI初期値を自動設定（false=未知タイプ）
                const histHit = applyRomFromHistory(pendingValue);           // ★ V15.0: 過去履歴ヒット時はROM①③も自動入力（タイプも上書き）

                // ★ V16.9: 完全一致が無い場合のみ、相似度80%超の類似QRからROMを予測入力
                //   予測もできなければROM欄は触らない＝従来どおり前回入力値がそのまま残る
                const fuzzyHit = histHit ? false : applyRomFromFuzzyHistory(pendingValue);

                // ★ V18.8: この主基板の「前回の封印」を確定させる（④で照合に使う）
                expectedSeals = lookupSealHistory(pendingValue);

                // ★ V16.3: 判別マップにも過去履歴にも無い＝過去に例の無い主基板QR → 赤文字警告
                // ★ V16.9: 類似QRから予測できた場合はオレンジのバナーで案内するため赤文字は出さない
                setUnknownMainboardNote(!typeMatched && !histHit && !fuzzyHit);
                currentStep = 3;
                updateUI();
                focusRomInput();
                html5QrCode.resume();
                saveState(); // ★
                return;
            }

            if (currentStep === 3) {
                currentData.romId = pendingValue;
                saveRomHistoryEntry(currentData.mainBoardId, pendingValue); // ★ V15.0: 主基板QR→ROMを端末に記憶
                currentStep = 4;
                updateUI();
                html5QrCode.resume();
                saveState(); // ★
                return;
            }
        }

        // ========================================
        // ★ V18.6: 封印登録の確認モーダル
        //   カメラに重ねた緑ボタンは誤タップしやすいので、押しても即登録しない。
        //   「OK」で finishMachine()（＝登録して次の台へ）、「戻る」で何もせず閉じる。
        //   何を登録しようとしているのか（台番・主基板・ROM・封印枚数）を必ず出す。
        // ========================================
        //   ★ V19.6: 画面下の「登録して次の台へ」ボタンからも呼ぶようにした。
        //     こちらは封印0枚（主基板/封印なしで進めた台）でも押せるボタンなので、
        //     allowEmpty=true のときだけ 封印0枚でも確認モーダルを開く。
        //     カメラ上の緑ボタンは今までどおり引数なし（＝封印0枚では開かない）。
        function askSealRegister(allowEmpty) {
            // 念のため二重チェック。④以外では開かない
            if (currentStep !== 4) return;
            const seals = (currentData && currentData.seals) ? currentData.seals : [];
            // 封印0枚のときは、緑ボタン（allowEmpty未指定）からは開かない
            if (seals.length === 0 && !allowEmpty) return;

            const detail = document.getElementById('seal-confirm-detail');
            if (detail) {
                detail.innerHTML =
                    '台番　：<b>' + escHtml(currentData.machineId || "-") + '</b><br>' +
                    '主基板：' + escHtml(currentData.mainBoardId || "-") + '<br>' +
                    'ROM　：' + escHtml(currentData.romId || "-") + '<br>' +
                    '封印　：<b>' + seals.length + '枚</b>' +
                    // ★ V19.6: 0枚のときは一覧が空になるので、封印なしと明示する
                    (seals.length === 0
                        ? '<br><span style="color:#dc2626; font-weight:bold;">（封印を1枚も読んでいません）</span>'
                        : '<br>' + seals.map(function (v) { return '　・' + escHtml(v); }).join('<br>'));
            }

            // ★ V18.8: 前回あった封印が読めていなければ、赤枠で警告を上乗せする
            const modal = document.getElementById('seal-confirm-modal');
            const c = compareSeals();
            if (detail && c.state === 'wait') {
                detail.innerHTML =
                    '<div style="color:#dc2626; font-weight:bold; font-size:16px; margin-bottom:8px;">' +
                    '⚠ 前回あった封印が ' + c.waitList.length + '枚 読めていません<br>' +
                    c.waitList.map(function (v) { return '　・' + escHtml(v); }).join('<br>') +
                    '</div>' + detail.innerHTML;
            }
            if (modal) { modal.style.border = (c.state === 'wait') ? '6px solid #dc2626' : 'none'; }

            document.getElementById('seal-confirm-overlay').style.display = 'flex';
            scrollToTopInstant();
        }

        function closeSealConfirm() {
            const ov = document.getElementById('seal-confirm-overlay');
            if (ov) ov.style.display = 'none';
        }

        // OK → 登録して次の台へ
        function confirmSealRegister() {
            closeSealConfirm();
            finishMachine();
        }

        // 戻る → 何もしない（封印スキャンの画面に留まる）
        function cancelSealRegister() {
            closeSealConfirm();
        }

        // ★ 赤い確認画面で実行する「戻る処理」を保持
        let pendingBackAction = null;

        // ★ 赤い確認画面を表示し、OK時に実行する処理を登録
        function showBackConfirm(action) {
            pendingBackAction = (typeof action === 'function') ? action : null;
            document.getElementById('back-confirm-overlay').style.display = 'flex';
            scrollToTopInstant(); // ★ V16.6
        }

        // ★ 確認モーダルの「戻る」：即戻らず赤い警告で確認
        function rejectValue() {
            showBackConfirm(() => {
                document.getElementById('confirm-overlay').style.display = 'none';
                try {
                    if (html5QrCode && html5QrCode.resume) html5QrCode.resume();
                } catch (e) {}
            });
        }

        // ★ 赤警告で「戻る」確定：登録された戻る処理を実行
        function confirmBack() {
            document.getElementById('back-confirm-overlay').style.display = 'none';
            const action = pendingBackAction;
            pendingBackAction = null;
            if (typeof action === 'function') action();
        }

        // ★ 赤警告で「キャンセル」：元の画面に復帰（戻らない）
        function cancelBack() {
            document.getElementById('back-confirm-overlay').style.display = 'none';
            pendingBackAction = null;
        }

        function updateUI() {
            document.getElementById('btn-skip').style.display = (currentStep === 2 || currentStep === 4) ? 'block' : 'none';
            document.getElementById('btn-finish').style.display = (currentStep === 4) ? 'block' : 'none';
            document.getElementById('btn-back').style.display = (currentStep > 1) ? 'block' : 'none';

            document.getElementById('rom-input-area').style.display = (currentStep === 3) ? 'block' : 'none';
            const cameraVisible = (currentStep !== 3);
            document.getElementById('reader-container').style.display = cameraVisible ? 'block' : 'none';

            // ★ カメラ表示中は点灯意図を復元（点灯状況の保持）、非表示時は消灯
            if (!cameraVisible) {
                forceTorchOff();
            } else {
                restoreTorchIfDesired();
            }

            const showNormalInput = (currentStep === 1 || currentStep === 2);
            document.getElementById('normal-input-area').style.display = showNormalInput ? 'block' : 'none';

            // ★ V13.9: 手入力欄のキーボード切替
            //    ①台番=テンキー / ②主基板=通常キーボード（英数字・記号も入力可）
            const manualInput = document.getElementById('manual-input');
            if (manualInput) {
                if (currentStep === 2) {
                    manualInput.setAttribute('inputmode', 'text');
                    manualInput.placeholder = "主基板手入力（英数字可）";
                } else {
                    manualInput.setAttribute('inputmode', 'numeric');
                    manualInput.placeholder = "台番手入力";
                }
            }

            const titles = ["", "① 台番号スキャン", "② 主基板スキャン", "③ ROM入力", "④ 封印スキャン"];
            document.getElementById('status').innerText = titles[currentStep];

            updateSealRegisterButton();   // ★ V18.5: 画面が変わったら封印登録ボタンの表示も合わせる
            renderSealHistoryNote();      // ★ V18.8: 照合パネルも画面に合わせる

            // ★ V16.6: ステップ(=ページ)が切り替わったら必ず最上部へ戻す
            //    ROM入力欄フォーカス等と競合しないよう遅延リトライはしない
            if (lastRenderedStep !== currentStep) {
                lastRenderedStep = currentStep;
                scrollToTopInstant(false);
            } else if (currentStep === 1) {
                scrollToTopInstant(false);
            }
        }

        function updateSealDisplay() {
            const target = document.getElementById('seal-list-display');
            if (!target) return;
            const seals = (currentData && currentData.seals) ? currentData.seals : [];
            target.innerHTML = seals.map(s => `<span class="seal-tag">${s}</span>`).join('');
            updateSealRegisterButton();   // ★ V18.5: 封印の増減にあわせてボタンの表示も更新
            renderSealHistoryNote();      // ★ V18.8: 前回の封印との照合も描き直す
        }

        // ========================================
        // ★ V18.5: カメラに重ねた「封印登録」ボタン（上・下の2つ）の表示切替
        //   出す条件（両方そろったときだけ）:
        //     ・④封印スキャンの画面である（currentStep === 4）
        //     ・封印が1枚以上スキャンされている
        //   → 押すと finishMachine()（画面下の「登録して次の台へ」と同じ動き）
        //   ※ ①②③の画面や封印0枚のうちは出さない＝誤タップで台が飛ぶのを防ぐ
        // ========================================
        const SEAL_REGISTER_BTN_IDS = ['btn-seal-register-top', 'btn-seal-register-bottom'];

        function updateSealRegisterButton() {
            const sealCount = (currentData && currentData.seals) ? currentData.seals.length : 0;
            const show = (currentStep === 4) && (sealCount > 0);

            SEAL_REGISTER_BTN_IDS.forEach(function (id) {
                const btn = document.getElementById(id);
                if (btn) btn.style.display = show ? 'block' : 'none';
            });
        }

        // ========================================
        // ★ V14.9: 履歴テーブルの長押し修正
        //   ・描画をrenderHistoryTable()に一元化（data-indexでallDataと紐付け）
        //   ・600ms長押しで修正モーダル（誤タップ防止: 指を動かす/途中で離すとキャンセル）
        //   ・修正保存でallData更新→再描画→自動保存
        // ========================================
        function renderHistoryTable() {
            const tbody = document.getElementById('history-tbody');
            if (!tbody) return;
            tbody.innerHTML = "";
            // 新しい順に表示（allDataの後ろから）
            for (let i = allData.length - 1; i >= 0; i--) {
                const d = allData[i];
                const tr = document.createElement('tr');
                tr.dataset.index = i;
                tr.innerHTML =
                    `<td>${d.machineId || ""}</td>` +
                    `<td>${d.mainBoardId || ""}</td>` +
                    `<td>${d.romId || ""}</td>` +
                    `<td>${d.sealsText || ""}</td>`;
                tbody.appendChild(tr);
            }
        }

        const LONG_PRESS_MS = 600;
        let lpTimer = null;
        let lpRow = null;

        function lpCancel() {
            clearTimeout(lpTimer);
            lpTimer = null;
            if (lpRow) lpRow.classList.remove('row-pressing');
            lpRow = null;
        }

        function lpStart(e) {
            const tr = e.target && e.target.closest ? e.target.closest('tr[data-index]') : null;
            if (!tr) return;
            lpCancel();
            lpRow = tr;
            tr.classList.add('row-pressing');
            lpTimer = setTimeout(() => {
                const idx = parseInt(tr.dataset.index, 10);
                lpCancel();
                openEdit(idx);
            }, LONG_PRESS_MS);
        }

        function setupHistoryLongPress() {
            const tbody = document.getElementById('history-tbody');
            if (!tbody) return;
            tbody.addEventListener('touchstart', lpStart, { passive: true });
            tbody.addEventListener('touchmove', lpCancel, { passive: true });  // スクロール操作は修正扱いしない
            tbody.addEventListener('touchend', lpCancel);
            tbody.addEventListener('touchcancel', lpCancel);
            // PC検証用（マウス）
            tbody.addEventListener('mousedown', lpStart);
            tbody.addEventListener('mouseup', lpCancel);
            tbody.addEventListener('mouseleave', lpCancel);
            tbody.addEventListener('contextmenu', e => e.preventDefault());
        }

        let editIndex = -1;

        function isEditOpen() {
            const el = document.getElementById('edit-overlay');
            return !!el && el.style.display === 'flex';
        }

        function openEdit(idx) {
            if (idx < 0 || idx >= allData.length) return;
            editIndex = idx;
            const d = allData[idx];
            document.getElementById('edit-machine').value = d.machineId || "";
            document.getElementById('edit-mainboard').value = d.mainBoardId || "";
            document.getElementById('edit-rom').value = d.romId || "";
            document.getElementById('edit-seals').value = d.sealsText || "";
            // ★ V19.8: 開くたびに3欄とも「タップ＝カメラ」の状態に戻す
            //   （前回 ✏ 手入力にしたまま次の台でもキーボードが出る、を防ぐ）
            EDIT_SCAN_FIELDS.forEach(function (id) {
                const el = document.getElementById(id);
                if (el) el.readOnly = true;
            });
            document.getElementById('edit-scan-area').style.display = 'none';
            document.getElementById('edit-overlay').style.display = 'flex';
            scrollElTop('edit-modal');  // ★ V16.6
            scrollToTopInstant();       // ★ V16.6
        }

        function closeEdit() {
            // ★ V19.8: 修正画面のカメラが開いていれば必ず止める（止め忘れ＝本体カメラが復帰しない）
            closeEditScan();
            document.getElementById('edit-overlay').style.display = 'none';
            scrollToTopInstant(); // ★ V16.6
            editIndex = -1;
        }

        // ========================================
        // ★ V19.8: 「登録データの修正」画面でのカメラ読み直し
        //   ねらい）修正のたびに手で打ち直すのが大変なので、
        //           台番・主基板・封印の各欄をタップしたらその場でカメラを出して読み直せるようにする。
        //   仕様）
        //     ・台番   … 数字のみのQRを受け付ける。1件読んだらカメラを自動で閉じる（上書き）
        //     ・主基板 … 封印QR(先頭B)と数字だけのQRは無視。1件読んだら自動で閉じる（上書き）
        //     ・封印   … 封印QR(先頭B)だけを受け付け、重複を除いて「 / 」区切りで追加。続けて読める
        //     ・どの欄も画面に値が出るだけで、「保存」を押すまで確定しない（＝これが確認フェーズ）
        //   注意）端末はカメラを同時に2つ使えない。開くとき本体スキャナーを止め、
        //         閉じるとき initScanner() で本体を必ず戻す。
        // ========================================
        const EDIT_SCAN_FIELDS = ['edit-machine', 'edit-mainboard', 'edit-seals'];

        let editScanner    = null;   // 修正画面専用のカメラ（本体 html5QrCode とは別物）
        let editScanTarget = null;   // 'machine' | 'mainboard' | 'seals'
        let editSealAdded  = 0;      // 封印をこの回で読み足した枚数（表示用）
        let editTorchOn    = false;  // 修正画面カメラのライト状態

        // 封印欄の文字列 → 配列
        function getEditSealList() {
            const v = document.getElementById('edit-seals').value.trim();
            return v ? v.split('/').map(function (x) { return x.trim(); }).filter(Boolean) : [];
        }

        // 配列 → 封印欄の文字列（保存時と同じ「 / 」区切りに揃える）
        function setEditSealList(list) {
            document.getElementById('edit-seals').value = list.join(' / ');
        }

        // 「✏」：readonlyを外してキーボードで直せるようにする
        function enableEditManual(fieldId) {
            closeEditScan();                 // カメラが開いていたら閉じる
            const el = document.getElementById(fieldId);
            if (!el) return;
            el.readOnly = false;
            el.focus();
            el.select();
        }

        // 読み取り中ラベル／件数表示の更新
        function updateEditScanInfo() {
            const label = document.getElementById('edit-scan-target-label');
            const count = document.getElementById('edit-scan-count');
            const name = (editScanTarget === 'machine') ? '台番'
                       : (editScanTarget === 'mainboard') ? '主基板'
                       : '封印';
            if (label) label.innerText = '📷 ' + name + ' を読み取り中';

            if (!count) return;
            if (editScanTarget === 'seals') {
                count.innerText = '追加：' + editSealAdded + '枚　（現在 ' + getEditSealList().length + '枚）';
            } else {
                count.innerText = '1件読み取ると自動で閉じます';
            }
        }

        // カメラ起動（target: 'machine' / 'mainboard' / 'seals'）
        async function openEditScan(target) {
            if (!isEditOpen()) return;

            const fieldId = (target === 'machine') ? 'edit-machine'
                          : (target === 'mainboard') ? 'edit-mainboard'
                          : 'edit-seals';
            const field = document.getElementById(fieldId);
            if (!field || !field.readOnly) return;   // ✏手入力中はカメラを出さない

            // 別の欄でカメラが開いていたら、いったん閉じてから開き直す
            if (editScanner) {
                if (editScanTarget === target) return;   // 同じ欄なら何もしない（二重起動防止）
                closeEditScan(true);                     // true = 本体スキャナーは戻さない
                await new Promise(function (r) { setTimeout(r, 300); });
            }

            if (typeof Html5Qrcode === 'undefined') {
                alert("カメラ機能の読み込みに失敗しました。\n通信環境を確認し、ページを再読み込みしてください。");
                return;
            }

            // ① 本体スキャナーを止める（同時に2つは使えない）
            if (html5QrCode) {
                try { await html5QrCode.stop(); } catch (e) {}
            }

            editScanTarget = target;
            editSealAdded = 0;
            editTorchOn = false;
            document.getElementById('edit-scan-area').style.display = 'block';
            updateEditScanInfo();
            scrollElTop('edit-modal');   // カメラが画面外に出ないよう上に寄せる

            // ② 修正画面用のカメラを起動
            editScanner = new Html5Qrcode("edit-reader", { useBarCodeDetectorIfSupported: true });
            try {
                await editScanner.start(
                    { facingMode: "environment" },
                    {
                        fps: 30,
                        videoConstraints: { facingMode: "environment" },
                        qrbox: function (w, h) { return { width: w * 0.75, height: h * 0.75 }; }
                    },
                    function (text) { handleEditScanned(text); }
                );
                setTimeout(checkEditTorchSupport, 500);
            } catch (e) {
                console.error("修正画面のカメラ起動に失敗", e);
                editScanner = null;
                editScanTarget = null;
                document.getElementById('edit-scan-area').style.display = 'none';
                alert("カメラを起動できませんでした。\n他の画面でカメラを使っていないか確認してください。");
                initScanner();   // 本体カメラだけは戻しておく
            }
        }

        // 読み取り時の処理（対象外のQRは黙って無視し、読み続ける）
        function handleEditScanned(value) {
            // ---------- 台番 ----------
            if (editScanTarget === 'machine') {
                if (!isValidMachineId(value)) return;          // 数字のみ以外は無視

                document.getElementById('edit-machine').value = value;
                playScanBeep();

                // 選択中の店舗と違う店舗の台番なら注意喚起（ブロックはしない）
                const w = machineIdConfirmWarning(value);
                showScanToast(w.warn ? "⚠ 別店舗の台番です：" + value : "台番を読み取りました：" + value);

                closeEditScan();                               // 1件で閉じる
                return;
            }

            // ---------- 主基板 ----------
            if (editScanTarget === 'mainboard') {
                if (isValidSealQr(value)) return;              // 先頭B＝封印QR。無視
                if (/^\d+$/.test(value)) return;               // 数字だけ＝台番QR。無視
                if (isInvalidMainBoardQr(value)) return;       // BISHOP…は主基板ではない

                document.getElementById('edit-mainboard').value = value;
                playScanBeep();

                // 形式チェック（V17.3 mainboardQrShape）。おかしければ注意喚起だけ出す
                const qs = normalizeQrKey(value);
                const shapeNg = MAINBOARD_SHAPE_WARN && qs && !mainboardQrShape(qs);
                showScanToast(shapeNg ? "⚠ 形式が違うかも：" + value : "主基板を読み取りました：" + value);

                closeEditScan();                               // 1件で閉じる
                return;
            }

            // ---------- 封印（続けて読む） ----------
            if (editScanTarget === 'seals') {
                if (!isValidSealQr(value)) return;

                const list = getEditSealList();
                if (list.includes(value)) return;   // 同じ封印は1回だけ

                list.push(value);
                setEditSealList(list);
                editSealAdded++;
                updateEditScanInfo();
                playScanBeep();
                showScanToast("封印を追加しました（保存を押すまで確定しません）");
                return;
            }
        }

        // カメラ停止＋本体スキャナー復帰
        //   keepMainStopped=true のときは本体を戻さない（別の欄へ開き直す途中で使う）
        function closeEditScan(keepMainStopped) {
            const area = document.getElementById('edit-scan-area');
            if (area) area.style.display = 'none';

            const btn = document.getElementById('btn-edit-torch');
            if (btn) { btn.style.display = 'none'; btn.style.background = ''; }

            if (!editScanner) return;

            const sc = editScanner;
            editScanner = null;       // 先に null にして二重停止を防ぐ
            editScanTarget = null;
            sc.stop().catch(function (e) { console.warn("修正画面カメラ停止失敗", e); })
              .then(function () {
                  try { sc.clear(); } catch (e) {}
                  if (!keepMainStopped) initScanner();   // ★ 本体スキャナーを必ず戻す
              });
        }

        // 修正画面カメラのライト対応判定
        function checkEditTorchSupport() {
            const btn = document.getElementById('btn-edit-torch');
            if (!btn || !editScanner) return;
            try {
                const cap = editScanner.getRunningTrackCapabilities();
                btn.style.display = (cap && cap.torch) ? 'block' : 'none';
            } catch (e) {
                btn.style.display = 'none';
            }
        }

        // 修正画面カメラのライトON/OFF
        async function toggleEditTorch() {
            if (!editScanner) return;
            const next = !editTorchOn;
            try {
                await editScanner.applyVideoConstraints({ advanced: [{ torch: next }] });
                editTorchOn = next;
                const btn = document.getElementById('btn-edit-torch');
                if (btn) btn.style.background = next ? '#facc15' : '';
            } catch (e) {
                console.error("修正画面ライト切替失敗", e);
            }
        }

        function saveEdit() {
            if (editIndex < 0 || editIndex >= allData.length) {
                closeEdit();
                return;
            }
            const d = allData[editIndex];
            d.machineId = document.getElementById('edit-machine').value.trim();
            d.mainBoardId = document.getElementById('edit-mainboard').value.trim();
            d.romId = document.getElementById('edit-rom').value.trim();
            const sealsText = document.getElementById('edit-seals').value.trim();
            // 封印はsealsTextとseals配列の両方を更新（CSV出力・復元との整合を維持）
            d.seals = sealsText ? sealsText.split('/').map(s => s.trim()).filter(Boolean) : [];
            d.sealsText = d.seals.join(' / ');
            renderHistoryTable();
            saveState();
            closeEdit();
            showScanToast("修正を保存しました");
        }

        function handleManualInput() {
            if (currentStep === 3) {
                const r1 = sanitizeRomDigits(document.getElementById('rom-1'));
                const r2 = getRomType();
                let r3 = sanitizeRomDigits(document.getElementById('rom-3'));

                // ★ V13.9: ROM①は4桁必須
                if (r1.length !== 4) {
                    alert(`⚠ ROM①が4桁ではありません（現在${r1.length}桁）\n4桁の数字を入力してください`);
                    focusRomInput();
                    return;
                }

                // ★ V13.9: KYの場合、ROM③は3桁必須
                if (r2 === "KY" && r3.length !== 3) {
                    alert(`⚠ ROM③が3桁ではありません（現在${r3.length}桁）\n3桁の数字を入力してください`);
                    focusRom3WithKeyboard();
                    return;
                }

                if (r2 === "EAI") {
                    r3 = "";
                    document.getElementById('rom-3').value = "";
                }

                prevRom1 = r1;
                prevRom3 = r3;

                const romId = r1 + r2 + r3;
                pendingValue = romId;

                // ★ V15.6: 過去取得済みと違うROMが入力されたら赤警告で再確認
                if (autoFilledRom && romId !== autoFilledRom) {
                    showConfirmation(
                        romId,
                        true,
                        "\u26a0 過去取得済みのROM番号と異なります<br>" +
                        "過去：" + autoFilledRom + "<br>今回：" + romId + "<br>" +
                        "本当にこのROMで登録して良いですか？"
                    );
                } else {
                    showConfirmation(romId);
                }
                return;
            }

            const val = document.getElementById('manual-input').value.trim();
            if (!val) return;

            if (currentStep === 1 && !isValidMachineId(val)) {
                return;
            }

            pendingValue = val;

            // ★ V17.4: 主基板QRを手入力した場合も形式チェックして警告
            if (currentStep === 2) {
                const w = mainboardConfirmWarning(val);
                showConfirmation(val, w.warn, w.msg);
            } else if (currentStep === 1) {
                // ★ V17.7: 台番を手入力した場合も店舗の一致をチェック
                const mw = machineIdConfirmWarning(val);
                showConfirmation(val, mw.warn, mw.msg);
            } else {
                showConfirmation(val);
            }
            document.getElementById('manual-input').value = "";
        }

        function skipRomInput() {
            if (currentStep !== 3) return;

            currentData.romId = "なし";
            currentStep = 4;
            updateUI();
            html5QrCode && html5QrCode.resume && html5QrCode.resume();
            saveState(); // ★
        }

        function skipStep() {
            if (currentStep === 2) {
                currentData.mainBoardId = "なし";
                // ★ V15.6/V15.6: 主基板なし → 自動入力状態・赤文字・欄の色をクリア
                autoFilledRom = null;
                setRomHistoryHighlight(false);
                setUnknownMainboardNote(false); // ★ V16.3: 未知主基板の警告もクリア
                clearFuzzyRomState();           // ★ V16.9: 予測入力の表示・状態もクリア
                expectedSeals = null;           // ★ V18.8: 主基板なし＝照合対象なし
                currentStep = 3;
                updateUI();
                focusRomInput();
                saveState(); // ★
                return;
            }

            if (currentStep === 4) {
                if (currentData.seals.length === 0) {
                    currentData.seals.push("なし");
                }
                finishMachine();
                return;
            }

            updateUI();
        }

        function finishMachine() {
            const sealsText = currentData.seals.join(' / ');

            allData.push({
                ...currentData,
                sealsText: sealsText,
                time: new Date().toLocaleTimeString()
            });

            renderHistoryTable(); // ★V14.9: 一元化

            // ★ V18.8: この台の封印を端末の実績として記録（次回はこれが最優先で照合される）
            saveSealHistoryEntry(currentData.mainBoardId, currentData.seals);

            currentStep = 1;
            currentData = { seals: [] };
            expectedSeals = null;           // ★ V18.8: 次の台へ移るので照合対象をリセット
            setUnknownMainboardNote(false); // ★ V16.3: 次の台へ移る際に未知主基板の警告をクリア
            clearFuzzyRomState();           // ★ V16.9: 予測入力の表示・状態もクリア

            document.getElementById('seal-list-display').innerHTML = "";
            document.getElementById('manual-input').value = "";

            document.getElementById('rom-1').value = prevRom1;
            document.getElementById('rom-3').value = prevRom3;
            handleRomTypeChange();

            updateUI();
            saveState(); // ★ 1台完了ごとに必ず保存
        }

        // ★ 「前へ戻る」：赤い確認画面を表示してからdoGoBackを実行
        function goBack() {
            showBackConfirm(doGoBack);
        }

        function doGoBack() {
            if (currentStep === 4 && currentData.seals.length > 0) {
                currentData.seals.pop();
                updateSealDisplay();
            } else if (currentStep > 1) {
                currentStep--;
            }

            updateUI();
            saveState(); // ★
        }

        function buildCsvBlobAndFileName() {
            // ★ V15.7修正: encoding-japanese を async 読込にしたため未読込の可能性をガード
            if (typeof Encoding === 'undefined') {
                alert("文字コード変換ライブラリが未読み込みです。\n通信環境を確認し、ページを再読み込みしてください。");
                throw new Error("Encoding library not loaded");
            }

            let csvContent = "社員,店舗,時間,台番,主,ROM,封印\r\n";

            allData.forEach(d => {
                csvContent += `${staffId},${shopId},${d.time},${d.machineId},${d.mainBoardId},${d.romId},"${d.sealsText}"\r\n`;
            });

            const unicodeArray = Encoding.stringToCode(csvContent);
            const sjisArray = Encoding.convert(unicodeArray, 'SJIS', 'UNICODE');
            const uint8Array = new Uint8Array(sjisArray);
            const blob = new Blob([uint8Array], { type: 'text/csv;charset=shift-jis' });
            const fileName = `点検_${shopId}_${new Date().toLocaleDateString().replace(/\//g, '-')}.csv`;

            return { blob, fileName };
        }

        function saveBlobAsFile(blob, fileName) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        async function downloadCSV() {
            if (allData.length === 0) {
                alert("データなし");
                return;
            }

            const { blob, fileName } = buildCsvBlobAndFileName();
            saveBlobAsFile(blob, fileName);
            lastSavedFileName = fileName; // ★ V16.0: メール本文用に保持

            // ★ V15.6: メール送信は廃止しSlack送信に変更（メール処理は一旦コメントアウト）
            // const subject = encodeURIComponent(`点検データ_${shopId}`);
            // const body = encodeURIComponent(
            //     `点検データを送付します。\n\n` +
            //     `保存ファイル名: ${fileName}\n` +
            //     `※保存されたCSVファイルを添付して送信してください。`
            // );

            // ★ V15.9: 保存後は自動遷移せず、確認ダイアログを即表示する。
            //   Slackへの遷移は「Slackで送信先を開く」ボタンのタップ(ユーザージェスチャ)で
            //   openSlackDM() から発火 → iOSでも指定Group DMへ確実に遷移する。
            //   （旧: 保存直後に自動 location.href していたため Slackは開くがDM未選択になっていた）
            //   ダイアログはSlackから戻ってきても表示されたまま残るので、
            //   送信後に「続き」または「初期化」を選べる。
            showResumeConfirm(
                "CSVを保存しました。\n\n" +
                "①「Slackで送信先を開く」または「メールで送信」→ 保存したCSVを添付して送信\n" +
                "②送信後このアプリに戻り、下のいずれかを選択\n\n" +
                "続きからはじめる = データを残す（再起動時に復元可能）\n" +
                "初期化して最初から = 自動保存を削除して店舗選択画面へ",
                () => { resetToSetup(); },  // 初期化して最初から
                null,                       // 続きからはじめる（何もしない）
                true                        // ★ Slackボタンを表示
            );
        }
    </script>
